version: 1

# ---------- the four concerns ----------

concerns:
  wcag:
    name: WCAG 2.2 AA accessibility
    applies_to: every UI folder (components, pages)
    test: each interactive element keyboard-operable, screen-reader-labelled, contrast-passing
  auth:
    name: server-side auth + authorization-scoped data
    applies_to: every server folder that touches user-owned data (services, handlers, actions, repositories)
    test: server filters every response to the caller's authorization scope BEFORE sending
  mobile:
    name: mobile-first
    applies_to: every UI folder
    test: design starts at small viewport; grows up
  i18n:
    name: internationalization
    applies_to: every UI folder
    test: no hardcoded user-facing strings; every label routed through the i18n layer

# ---------- where each concern is declared ----------

declaration_locations:
  spec_yaml.cross_cutting:
    required: true
    shape: |
      cross_cutting:
        wcag: <sentence | "n/a — <one-line reason>">
        auth: <sentence | "n/a — <one-line reason>">
        mobile: <sentence | "n/a — <one-line reason>">
        i18n: <sentence | "n/a — <one-line reason>">
    note: every spec.yaml declares all four; "n/a" with reason allowed

# ---------- enforcement ----------

enforcement:
  spec_writer_responsibility: declare each concern (concrete handling OR "n/a — reason") in every spec.yaml
  verify_via: STANDARDS_COMPLIANCE.yaml manual walk at lock time
  banned: omitting a concern; saying "n/a" without a one-line reason

