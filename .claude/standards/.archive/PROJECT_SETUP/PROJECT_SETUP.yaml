version: 1

# Rationale lives in PROJECT_SETUP.detail.md. This file carries only what an
# agent needs to APPLY and ENFORCE.

# ---------- repo folder layout ----------

folder_layout:
  rule: |
    Repo root holds ONLY:
    - /docs/                    — all human + machine docs
    - /code/                    — all product code (no exceptions)
    - /manual-results/          — git-ignored; where each app's local-only POST /api/v1/manual-results/<flow> route writes manual-flow results for the CLI agent to read (AGENT_STANDARDS.yaml manual_flow_surfaces). Created on first run; MUST be in .gitignore; never committed.
    - /README.md                — human prose
    - /README.yaml              — machine-readable project metadata
    - /CLAUDE.md (optional)     — per-project Claude Code instructions
    - Repo metadata (hidden / dev-tooling, NOT product code):
        .git/, .github/, .gitignore, .gitattributes,
        .claude/, .husky/, .vscode/, .editorconfig,
        .prettierrc, .prettierrc.json, .prettierignore,
        .npmrc, .nvmrc,
        host-provider deploy markers (any dotfile a deploy provider drops at the root)

    Code MUST NOT live at root. /web/, /apps/, /packages/, /services/, /scripts/, /src/, /lib/, /tests/, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, turbo.json, tsconfig.json (if any), next.config.*, vercel.json, .env.example, .env.local — ALL of these live under /code/.

    Documentation files (anything ending in .md other than README.md / CLAUDE.md) MUST live under /docs/, NOT at root. AMENDMENT-* / HANDOFF-* filename patterns are banned anywhere in the repo — documentation reads declarative present-tense, with past decisions captured in commit messages rather than checked-in narrative files.

  single_app_layout:
    description: the common shape — one Next.js app at /code/web/, no workspace
    tree: |
      <repo-root>/
      ├── docs/
      ├── code/
      │   ├── web/                       # the Next.js app
      │   │   ├── package.json
      │   │   ├── pnpm-lock.yaml
      │   │   ├── next.config.ts
      │   │   ├── tsconfig.json
      │   │   ├── .env.example
      │   │   ├── public/
      │   │   └── src/
      │   └── (any additional non-web code goes alongside web/, e.g. scripts/, packages/)
      ├── README.md
      ├── README.yaml
      ├── .gitignore
      ├── .github/
      └── .claude/

  turborepo_layout:
    description: workspace repos (e.g., ai-stores with apps/marketing + apps/admin + apps/chat + packages/* + services/*)
    tree: |
      <repo-root>/
      ├── docs/
      ├── code/
      │   ├── package.json               # workspace root package.json
      │   ├── pnpm-workspace.yaml
      │   ├── turbo.json
      │   ├── pnpm-lock.yaml
      │   ├── tsconfig.base.json
      │   ├── apps/
      │   │   ├── marketing/
      │   │   ├── admin/
      │   │   └── chat/
      │   ├── packages/
      │   │   ├── ui/
      │   │   ├── auth/
      │   │   └── ...
      │   └── services/
      │       └── python-workers/
      ├── README.md
      ├── README.yaml
      ├── .gitignore
      ├── .github/
      └── .claude/

  vercel_root_directory:
    rule: every Vercel project sets `Root Directory` to the per-app code path
    single_app: "code/web"
    turborepo_app: "code/apps/<app-name>"
    set_via: 'Vercel dashboard OR API (`PATCH /v9/projects/<id>` with `"rootDirectory": "code/web"`)'

# ---------- installer auto-setup steps ----------
# `bash ~/.claude/standards/scripts/install-slice-gates.sh <repo>` runs end-to-
# end. Steps run in order; each is idempotent and safely re-runnable. Steps
# needing optional inputs (pnpm, gh, security keychain) skip with a clear
# message when the input is absent.

installer_auto_setup:
  always:
    - vendor `.claude/standards/` + `.claude/agents/` from user-global
    - install 3 universal gates (verify-no-history-baked-in, verify-issue-body-draft, verify-commit-stamp)
    - create / preserve per-project CLAUDE.md
  shipping_or_maintained:
    - install lib helpers (walk, kebab, exports, blast-radius, changed-paths, design-source)
    - install verify-all.mjs orchestrator
    - install 4 flat-layout gates + 13 per-folder gates + 15 verifier modes + agents-manifest generator
    - install husky pre-push hook + pre-commit Gate 1+2
    - "`pnpm add -D yaml puppeteer` (auto when pnpm + package.json present; skips with one-line manual command otherwise)"
  any_status:
    - create `type:tech-debt` + `status:ready` labels on the project's GH repo (idempotent; silent if present; skips when `gh` not on PATH or auth absent)
    - mirror session memory from $STANDARDS_MEMORY_SOURCE (default = the user's canonical memory-source path on this machine) into this repo's session-memory dir, ONLY when target is empty / missing

# ---------- pre-setup — provision before any code ----------

pre_setup:
  required_before_any_code:
    1:
      what: GitHub repo
      action: create; capture URL into project memory
    2:
      what: primary GitHub user for this project
      action: confirm with user; use earlier memory if defined; never assume; capture in memory
    3:
      what: GitHub Project board
      action: create; capture URL into project memory + reference.md
    4:
      what: host provider project (e.g., Vercel / Cloudflare Pages / AWS Amplify / Render)
      action: create on the dashboard; capture dashboard URL; NEVER auto-create via CLI (e.g., `vercel link --yes`)
    5:
      what: third-party services
      action: provision per-project; capture credentials in project memory; only what the project actually needs
  capture: every URL + account goes into project memory + reference.md

# ---------- ports + local hostnames ----------

ports:
  source_of_truth: "/etc/hosts"
  rule: every project gets a UNIQUE port; never share
  hostname_pattern: "<project>.<dev-tld>"
  dev_tld:
    default: ".local"
    examples: [".local", ".lan", ".test", ".yantrakit.local"]
    chosen_per_project: true
  /etc/hosts_entry: "127.0.0.1   <project>.<dev-tld>   # port XXXXX"
  storybook_entry: "127.0.0.1   <project>-storybook.<dev-tld>   # port YYYYY"
  package_json_alignment:
    rule: scripts MUST match /etc/hosts ports exactly
    example_scripts:
      dev: "next dev --port XXXXX"
      start:local: "next start --port XXXXX"
      storybook: "storybook dev --port YYYYY"
  on_drift: "/etc/hosts wins; update package.json to match"

# ---------- root README — paired YAML (machine) + Markdown (human) ----------

readme_requirements:
  pattern: paired-file (README.yaml + README.md) at project root — same idea as __specs__/spec.yaml + spec.md
  location: project root

  README.yaml:
    purpose: machine-readable project metadata; consumed by github-project-agent, /agents.json generator, /llms.txt generator, deploy scripts, e2e tests
    required_fields:
      project_name: string                        # kebab/dot-case repo identifier; e.g., "com.yantrakit.audit"
      description: string                         # one-line plain English
      status: enum[planning, shipping, maintained, archived]   # project lifecycle state; gates which standards apply
      github:
        account: string                           # gh auth switch --user <this>; e.g., "yantrakitinc"
        owner: string                             # org/user that owns the repo
        repo: string                              # repo name
        repo_url: string                          # https://github.com/<owner>/<repo>
        project_board_number: integer             # GH project board number (for --project flag)
      local_dev_url: string                       # http://<project>.<dev-tld>:<port>
      production_url: string                      # https://...
      last_updated: iso8601_datetime              # drift signal
    optional_fields:
      tier: integer                               # 1 / 2 / 3 / 4 / 5 / 6 per app registry tiers
      category: enum[primitive, app, standalone, archived]
      stack: map                                  # framework / database / language / package_manager
      host_provider: enum[cloud-run, vercel, cloudflare, render, fly, ...]
      published_packages: list<string>            # @<scope>/<package> npm packages this repo publishes; consumed by downstream registries / marketing-site products lists
      parent_project: string|null                 # when this is a child of another (e.g., extension companion)
      related_repos: list<string>                 # cross-primitive deps
      third_party_services: list<map>             # [{ name, purpose, dashboard_url }, ...]
      ui_screenshot_match_threshold: int          # default 85. Score 0-100 from verify-ui-screenshots-match-designs.mjs; states below the threshold fail the gate. Tune per repo when the design source is photoshop-detailed (raise) vs sketch-level (lower).
      ui_screenshot_dev_server_url: string        # default "http://localhost:3000". URL Puppeteer hits to navigate flows; manual playbook `start:` values resolve relative to this.
    enforced_by: convention — consuming tools (github-project-agent, deploy scripts, e2e tests) surface malformed metadata at runtime
    status_semantics:
      planning:
        description: pre-launch; Coming Soon page only; no production user-facing features yet
        exempts_from:
          - "__specs__/ folders + standards-compliance.yaml requirements (no features to spec)"
          - "verify-standards-compliance (no locks to check)"
          - "verify-source-coverage (no slices to cover)"
          - "100% perFile test coverage (no business logic to test)"
          - "verify-commit-stamp pre-commit hook (no behavior files to gate)"
        still_required:
          - "README.yaml status field accurate (honored by convention; consuming tools surface drift)"
          - "verify-no-history-baked-in (any docs that exist read present-tense)"
          - "typecheck + lint (the Coming Soon page still has to compile + lint clean)"
      shipping:
        description: active development with user-facing features; full standards regime applies
        exempts_from: []
      maintained:
        description: feature-complete; only critical fixes / security patches; full standards apply
        exempts_from: []
      archived:
        description: end-of-life; no further changes; standards frozen at archival commit
        exempts_from:
          - "all verify gates (the repo is read-only history)"

  README.md:
    purpose: human prose; references README.yaml fields rather than duplicating
    required_sections:
      - Prerequisites           # Node version, pnpm, exact /etc/hosts lines to add
      - Structure               # folder tree per `folder_layout.single_app_layout` or `folder_layout.turborepo_layout`
      - Development             # exact command sequence (e.g., `cd code/web && pnpm install && pnpm dev`)
      - Tech Stack              # ordered list
      - Environment Variables   # refer to .env.example; list source for each value
      - Testing                 # how to run unit / E2E / live-browser walkthroughs
      - Deployment              # how the project deploys
    rule: do NOT duplicate machine fields from README.yaml in README.md prose; reference them by name and link to the YAML

# ---------- environment variables ----------

env_vars:
  required_files:
    .env.example:
      location: per-app root (e.g., `code/web/.env.example` for single-app; `code/apps/<app>/.env.example` for turborepo apps)
      contents: EVERY required variable, keys only (no values)
      per_variable_comment: "what it's for + where to get the value"
    .env.local:
      location: same dir as .env.example (per-app, NOT repo root)
      gitignored: true
      committed: never
  rules:
    - server_only vars NEVER use NEXT_PUBLIC_ prefix
    - host-provider env-var setting via CLI uses `printf '%s'`, NEVER `echo`
    - admin email lists are semicolon-separated, lowercase

# ---------- API surface ----------

api_surface:
  rule: every service method called by a Server Action MUST ALSO be exposed as an HTTP route
  per_route_artifacts:
    - "<feature>/__specs__/openapi.yaml"     # per-feature OpenAPI; see AGENT_STANDARDS.yaml
    - "<feature>/__specs__/manual/<flow>.md"  # browser-executable manual script
  versioning:
    url_pattern: "/api/v1/..."
    breaking_change: bump to /api/v2/...
  authorization: see AUTHORIZATION_STANDARDS.yaml (Layer A + Layer B + YAML→RLS DSL)
  runtime_surfaces:
    "/openapi.json":
      auto_generated: true
      source: every <feature>/__specs__/openapi.yaml
      see: AGENT_STANDARDS.yaml.agents_index
    "/docs":
      type: Swagger UI
      dev + staging: visible
      production: gated behind admin auth
  visibility_gates:
    ENABLE_ALL_API:
      true: 'ALL API routes reachable, including `visibility: "internal"`'
      false (default in production): internal routes return 404
    ENABLE_SWAGGER_FOR_ALL_API:
      true: Swagger UI lists ALL endpoints
      false (default in production): 'only `visibility: "public"` endpoints appear'
    local_dev_defaults: both true
    production_defaults: both false
    on_flip_in_production: MUST emit an audit event on flip + flip-back
  route_meta:
    required_export: "export const apiMeta = { visibility: 'public' | 'internal' } as const;"
    public: always reachable + always in Swagger
    internal: reachable only when ENABLE_ALL_API=true; in Swagger only when ENABLE_SWAGGER_FOR_ALL_API=true

# ---------- testing surfaces — all 4 required for 100% compliance ----------

testing_surfaces:
  required_for_lock:
    1:
      name: unit / integration
      tool: Vitest (or per-project equivalent)
      coverage: 100% lines / branches / functions / statements
    2:
      name: scripted E2E
      tool: Playwright (or per-project equivalent)
      assertion: real transport AND persisted state
    3:
      name: manual API
      tool: Chrome-extension agent driving Swagger UI
      coverage: one flow per endpoint
    4:
      name: manual UI
      tool: Chrome-extension agent driving __specs__/manual/<flow>.md
      coverage: every user-facing surface
  rule: NO production ship until all 4 are green for every user-facing surface
  see:
    - STANDARDS_COMPLIANCE.yaml      # the lock-time walk + freshness gate
    - TESTING.yaml                   # surface-specific rules

# ---------- project memory capture ----------

project_memory:
  location: "~/.claude/projects/<project-id>/memory/ (typically reference.md)"
  captures:
    - all URLs from pre_setup
    - primary GitHub user
    - local dev URLs + ports
    - dev-tld chosen for this project
    - project-specific setup decisions (DB choice, host provider, third-party services)

