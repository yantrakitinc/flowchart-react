version: 2

# Apply/enforce rules only. Rationale lives in AGENT_STANDARDS.detail.md.

# ---------- folder layout ----------

folder_layout:
  parent_folder:
    - "<code>.ts"
    - "__tests__/<code>.test.ts"
  __specs__/:
    required:
      - spec.yaml
      - spec.md
      - standards-compliance.yaml
    conditional:
      openapi.yaml: when feature ships HTTP routes
      asyncapi.yaml: when feature emits or subscribes to events
      exception.yaml: optional, opt-in — a standards waiver for this feature (see STANDARDS_COMPLIANCE.yaml.exception_file)
    subfolders:
      flows/:
        pattern: <fn>.flow.yaml          # one per exported function
      manual/:
        pattern: <flow>.md               # one runnable adversarial flow per HTTP / CLI / UI surface (markdown)

# ---------- spec.yaml ↔ spec.md partition ----------

spec_yaml_vs_spec_md:
  spec_yaml: implementation contract ONLY — exactly what a coder builds + a verifier checks against (operation/invocation, schemas, links, authorization, public API, tokens/state-classes consumed, test coverage). No narrative, no options-considered, no rationale, no history. A field not consumed to implement or verify the feature does not belong.
  spec_md: narrative ONLY — concept, exploration, decisions + WHY, alternatives rejected, out of scope
  history: not in spec.yaml/spec.md — UI → Changelog story (UI_COMPONENTS.yaml.story_file.required_stories.required_third_story); everything else → git
  rule: if a line specifies the build, it goes in spec.yaml; if it explains/justifies, spec.md

# ---------- spec.yaml schema ----------

spec_yaml:
  feature_name: string                    # kebab-case; unique repo-wide; named by .ignore.specs.yaml markers
  scope_authority: enum[user, claude]     # optional; default "user". When "claude", the coder makes in-spec scope calls without asking (helper extraction, internal field naming, table/column naming within the operation's domain, test fixture choices, log-key naming). NEVER applies to: invocation.type, public API shapes, permission slugs, data destruction, third-party API choice, library/framework choice, spec changes that alter behavior. Those still surface.
  ui_design: enum[required, not-applicable]   # optional. Default: required if invocation.type in (ui, server-action), else not-applicable. Set explicitly to override. When required, every flow needs __specs__/ui/<flow>.md with `<!-- ui-locked: YYYY-MM-DD -->` marker before coder phase runs (enforced by verify-ui-design-locked.mjs). When not-applicable, spec.md MUST include a one-line reason.
  operation:
    name: string                          # human-readable, e.g., "Sign in"
    slug: string                          # "(public)" | "(internal)" | <permission-slug>
    description: string                   # one-line plain English
  invocation:
    type: enum[http, ui, server-action, internal]
    method: string                        # required if type=http; GET | POST | PUT | PATCH | DELETE
    path: string                          # required if type in [http, ui]
    request_schema: string                # optional; $ref or inline
    response_schema: string               # optional; $ref or inline
  chat_agent:
    when_to_call: string                  # trigger condition the agent recognises
    when_not_to_call: string              # anti-condition
    natural_language_examples: list<string>   # user phrases for few-shot matching
    confirm_before: string                # what agent says before invoking; "none — read-only" allowed
    summarize_after_success: string       # one-line template
    summarize_after_failure: string       # one-line template
  cross_cutting:
    wcag: string                          # sentence OR "n/a — <reason>"
    auth: string                          # one-line summary; structured details in `authorization` block (required for DB-touching features per RULE 0)
    mobile: string
    i18n: string
  authorization:                          # REQUIRED on every DB-touching feature (schemas, repositories, services, routes, workers). RULE 0 enforces.
    layer_a_brand: string                 # the `AuthorizedPrincipal<S>` slug union the entry-point method requires; "n/a — schema, brand lives in the repo spec" for table schemas
    rls_directive: string                 # for schemas: "ENABLE ROW LEVEL SECURITY" (NOT FORCE — see cloud_sql_caveat); for non-schema features: "n/a — <reason>"
    policies:                             # list — for schemas with RLS: one entry per CREATE POLICY clause. For repositories/services: [].
      - operation: enum[SELECT, INSERT, UPDATE, DELETE]
        slug: string                      # permission slug the policy checks (or "(deny-all)" for closed policies)
        clause_using: string              # USING clause body verbatim, or "n/a" if not applicable
        clause_with_check: string         # WITH CHECK clause body verbatim, or "n/a" if not applicable
        rationale: string                 # one line: why this slug for this operation
    permission_slugs_used:                # list — every slug this feature references
      - slug: string                      # e.g. "emails:enqueue"
        audience: enum[user, service, both]
        roles_holding: list<string>       # role slugs that get this permission at seed time
        permission_addition_spec: path    # path to __specs__/permission-additions/<slug>.md when this slug is added by THIS slice (RULE 0.1 ceremony output). Omit when the slug pre-existed.
    rls_deny_test: string                 # path to the test that asserts an unauthorized principal is denied at the DB layer. "n/a — read-only" allowed only with explicit reason.
  links:
    flows: list<path>                     # required; ≥ 1
    tests: list<path>                     # required; ≥ 1
    manual: list<path>                    # optional
    openapi: path                         # required if invocation.type=http
    asyncapi: path                        # required if feature emits/subscribes events

# ---------- spec.md required sections ----------

spec_md_sections:
  - heading: "# <feature-path> — <one-line tagline>"
    body: h1
  - heading: "## Concept"
    body: "one paragraph: what this folder is, why it exists"
  - heading: "## Files"
    body: "numbered list of every behavior + SETUP file"
  - heading: "## Out of scope"
    body: "bulleted list of what this folder explicitly does NOT do"

# ---------- flow.yaml schema ----------

# A flow.yaml ENUMERATES EVERY PATH the function can take — happy, every error, every edge —
# so implementation + tests derive from a complete behavior map. An incomplete flow IS a defect.
# A happy-path-only flow for an operation that can fail, writes data, or checks authority is
# NON-COMPLIANT — do not stub it.

flow_yaml:
  flow: string                            # function name
  kind: enum[request-handler, predicate, service-method, repository-method, helper, composition-root]
  source: path                            # path to the .ts file
  symbol: string                          # exported symbol within source
  inputs: map<string, string>             # arg-name → type-description
  returns: list<string>                   # possible return-shape descriptions
  throws: list<string>                    # declared error names; [] allowed
  calls: list<string>                     # downstream calls; [] allowed
  called_by: list<string>                 # upstream callers
  emits_events: list<string>              # event names; [] allowed
  side_effects_on_success: list<string>   # ["none"] allowed
  side_effects_on_failure: string         # "none" or description
  transaction: string                     # "none" or scope description
  test: path                              # path to test file
  spec: path                              # path to this folder's spec.yaml
  ai_agent_action:                        # MUST be a map (not prose)
    when_to_call: string
    when_not_to_call: string
    natural_language_examples: list<string>
    agent_invocation: string              # HTTP shape | UI nav | server-action name | "internal — not callable"
    confirm_with_user_before: string
    summarize_to_user_after: string
  paths:                                  # named scenario paths — MUST be exhaustive
    happy: list<step>                     # required; ≥ 1
    error_*: list<step>                   # one per entry in `throws` AND per non-ok return — required when either is non-empty
    edge_*: list<step>                    # required for each applicable risk class the operation touches:
                                          #   edge_concurrent_*   — when a read precedes a write (TOCTOU/atomicity); name the race + the resolution
                                          #   edge_partial_state_* — when the op does ≥ 2 writes; name what holds if a later write fails
                                          #   edge_authority_*     — when the op checks permission/ownership; name allowed, denied, and over-grant boundaries
                                          #   edge_boundary_*      — empty/null/duplicate/oversized/expired inputs that change behavior
                                          # A happy-only `paths` for an op that fails, writes, or checks authority is NON-COMPLIANT.
                                          # Every error_/edge_ path MUST have a corresponding test (TESTING.yaml scenario_enumeration)
                                          # UNLESS the path is genuinely improbable, in which case its last step is marked
                                          #   "KNOWN-NOT-VALIDATED: <probability/why slim> — <why acceptable>"
                                          # KNOWN-NOT-VALIDATED is ONLY for slim-probability edges — never for a realistic
                                          # failure/authority/write path.
  mermaid: multiline_string               # optional; required when fn has ≥ 2 paths OR ≥ 3 collaborators

# ---------- manual flow schema (manual/<flow>.md) ----------

# A manual flow is the INDEPENDENT ADVERSARIAL REVIEW of an operation against the REAL running
# surface — plain markdown an agent (Claude Code Chrome extension, or the yk CLI) executes
# unattended after a human pastes it (or it's read from the app's local serve page). It is NOT a
# restatement of flows/<fn>.flow.yaml or the tests: its job is to probe, abuse, and BREAK.
# MANDATORY, NO ESCAPE HATCH: every callable surface (HTTP, CLI, or UI) HAS a flow with REAL
# runnable adversarial steps. An absent flow, a happy-path-only flow, or a "the automated tests
# already cover this" stub is NON-COMPLIANT; no automated-complete form exists.
# The loop: the extension drives the steps over HTTP / in the browser, POSTs results to the
# local-only results route (manual_flow_surfaces), and ALSO prints them (human copy-back
# fallback); the CLI agent reads manual-results/ and acts on them.

manual_md:
  path: <feature>/__specs__/manual/<flow>.md   # markdown; filename stem matches flows/<flow>.flow.yaml + the openapi operationId
  required_sections:                            # markdown headings, in this order
    - "# <flow>"                                # H1 title
    - "## Target"                               # `local` | `live` + the base URL the agent drives (a flow MAY target the live site)
    - "## Preconditions"                        # what must hold first (auth, seed, a running peer service); "none" is allowed
    - "## Steps"                                # numbered; >= 1 ADVERSARIAL action (abuse input, cross authority, replay, race) — never happy-path only
    - "## Assertions"                           # what MUST hold AND what MUST NOT happen (stating the negative is mandatory)
    - "## Report"                               # literal instruction: POST results to /api/v1/manual-results/<flow> AND print them
  step_shape:                                   # each numbered step, plain English the extension can execute
    action: required                            # e.g., "POST /v1/webhooks with another principal's id in the body"
    selector: optional                          # UI only: data-testid / aria-label / role+name
    input: optional                             # value to send / type
    expected: required                          # one-line observable post-state (status code, body field, UI state)
  rules:
    - spec_derived: authored from the SPEC ONLY (spec.yaml + spec.md + openapi.yaml/asyncapi.yaml + flows/<fn>.flow.yaml) — CODE-BLIND. Never read the source to write a flow. If the spec does not contain enough to author the flow, the SPEC is deficient — fix the spec, do not peek at the code.
    - adversarial: at least one step crosses authority, abuses input, replays, or races — happy-path only is NON-COMPLIANT
    - no_escape_hatch: a flow that merely cites automated tests is NON-COMPLIANT
    - self_contained: pasteable as-is; no reference to repo-internal test names or fixtures
    - report_footer: the ## Report section names the exact POST route AND says to also print the results
  # --- browser-agent executability (a flow a browser agent literally CANNOT perform is NON-COMPLIANT) ---
  browser_agent_rules:
    - http_or_browser_only: every step is doable with ONLY browser actions + HTTP. NEVER instruct the agent to run SQL, read a DB table, read a file, run a shell command, or inspect server logs. If a step needs server-side data (a magic-link token, a generated code, a seeded id), expose it via a local-only HTTP endpoint and name that exact URL — see manual_flow_surfaces.dev_data_routes.
    - deterministic_auth: sign-in steps use a deterministic credential (a seeded email + password), NOT an emailed magic link. If a flow must exercise magic-link, it fetches the link from the dev-email HTTP endpoint (GET /api/v1/dev/emails?to=<email> → emails[0].magic_link_path) — never from the DB or a mailbox.
    - exact_urls_only: give the exact URL for every navigation/fetch. Explicitly tell the agent NOT to guess or invent endpoints.
    - retry_cap: every flow states "if a step fails twice, record the flow FAIL with a note and STOP — do not loop the step."
    - selectors_must_exist: every data-testid / data-agent-action / aria-label a step names MUST already exist in the shipped surface (verify against the rendered page); referencing a non-existent selector is NON-COMPLIANT.
    - machine_result: the ## Report POST body carries an explicit boolean `ok` per flow (ok:true=pass, ok:false=fail). Progress/telemetry posts (no `ok`) are NOT verdicts. A flow's status = its latest post WHERE ok IS NOT NULL; note-only posts NEVER mask a real pass/fail.
    - local_auth_works_on_http: auth a flow depends on MUST function over local http (e.g. session cookies are Secure only in production, never in local dev) so cross-app / SSO steps are runnable locally.

# ---------- per-app manual-flow surfaces (every Next.js app) ----------

manual_flow_surfaces:
  manual_results_route:
    path: POST /api/v1/manual-results/<flow>     # the extension POSTs each flow's results here
    runtime: nodejs                              # NEVER edge — it must write the local filesystem
    local_only: true                             # accept ONLY when NODE_ENV !== "production" AND the request origin is localhost / 127.0.0.1
    also_blocked_by: the Phase-1 /api/* 503 middleware (defense in depth — it can never fire in a deployed env)
    writes_to: <repo>/manual-results/<flow>.<iso8601>.json   # git-ignored; the CLI agent reads + edits these
    bounds: flow stem validated against the shipped manual/<flow>.md set (no path traversal); body size-capped; application/json only
  dev_data_routes:                               # local-only HTTP exposure of server-side data a browser agent needs
    local_only: true                             # NODE_ENV !== production AND localhost origin; prod 404 + blocked by the /api/* middleware
    runtime: nodejs
    purpose: a browser agent cannot read the DB; any datum a flow needs (magic-link token, OTP, generated id) is fetched over HTTP, never queried
    canonical:
      "GET /api/v1/dev/emails?to=<email>": "returns the dev email outbox newest-first as JSON incl. a parsed magic_link_path — the only sanctioned way a flow obtains a magic link"
  serve_pages:
    local_only: true                             # served ONLY in local/dev; prod returns 404 (never on the live site)
    noindex: true                                # meta robots noindex + X-Robots-Tag + robots.txt disallow
    routes:
      "/manual": how-to guide + an index linking every manual/<flow>.md the app ships
      "/manual/<flow>": renders that flow's markdown for copy-paste into the extension
    executable_directive: the index/run page is written AS AN IMPERATIVE AGENT SCRIPT, not a human brochure — a top preamble ("you are a QA agent; run ONLY the playbooks shown below, in order; sign in via the password form; report via the form/POST"), each playbook inlined with its login + target + numbered steps, and the browser_agent_rules guardrails restated. If the page offers a run filter, it states the ACTIVE filter and the visible count so the agent runs only the shown subset.
  results_folder:
    path: <repo>/manual-results/                 # third top-level folder beside docs/ + code/
    gitignored: true                             # results are never committed
  storybook_qa_story:                            # UI tier only (authored when a UI surface exists). Full shape: UI_COMPONENTS.yaml.story_file.required_stories.verify_manual + verify_manual_master + verify_manual_separation.
    per_component: |
      a Verify-Manual story carrying the component's spec-derived manual flow as INSTRUCTIONS
      ONLY — what to test + what the spec promises. No component render (that is Playground) and
      no results form. Links to Playground (operate there; Showcase only when Playground cannot
      reach a required state) and tells the operator to record the verdict on the Master page.
    master_page: |
      exactly ONE library-wide `verify-manual--master` story: runbook + worklist (every
      component's Verify-Manual, linked) + the SINGLE results form — the only place verdicts are
      entered; it POSTs each saved verdict to the manual_results_route. Form code is never
      duplicated per component.

# ---------- standards-compliance.yaml schema ----------

standards_compliance_yaml:
  see: STANDARDS_COMPLIANCE.yaml

# ---------- /agents.json + /agents.txt auto-generation ----------

agents_index:
  generated_at: build-time                # never hand-maintained; never runtime
  source: every <feature>/__specs__/spec.yaml in repo
  outputs:
    "/agents.json":
      format: structured-json
      derived_from: spec.yaml.operation + invocation + chat_agent
      consumers: agents, tooling, CLI wrappers
    "/agents.txt":
      format: plain-text-summary
      derived_from: /agents.json
      consumers: humans, llms.txt-style readers
  hand_maintained_index_file: forbidden

# ---------- on-page agent affordances ----------

interactive_element_attributes:
  data-testid:
    required: true
    format: <feature>-<element>-<type>    # kebab-case, ≥ 3 hyphen-separated segments
  data-agent-action:
    required: true
    value_from: action_verbs              # see catalog below
  data-agent-step:
    required: true
    format: <surface>:<state>             # e.g., "whoami:anonymous"
  aria-label:
    required: true
    format: plain-English description of the element

action_verbs:
  - signin
  - signout
  - view
  - refresh
  - reload
  - create
  - edit
  - delete
  - submit
  - cancel
  - save
  - discard
  - open
  - close
  - expand
  - collapse
  - select
  - deselect
  - toggle
  - copy
  - paste
  - confirm
  - dismiss
new_verb_policy: extend this list via PR; never invent inline

# ---------- public-facing surface ----------

public_surface:
  /llms.txt:
    required: true
    location: site root
    format: plain text; index of operations + docs URLs + manual-script URLs
  docs_pages:
    rendering: server-rendered HTML / markdown (no JS required to read)
    test: '`curl <docs-url>` returns readable content'
  openapi_descriptions:
    style: plain English sentences in every `description:` field
    operationId: matches manual/<flow>.md filename stem
  banned_ui:
    - hover-only menus
    - drag-only interactions
    - image-only buttons (no aria-label / no text)
    - focus-only modals (no escape route)

# ---------- no padding folders ----------

no_padding_folders:
  rule: every direct sub-folder of src/features/<feature>/ MUST contain at least one .ts/.tsx file
  banned: empty folders, README-only folders, .gitkeep-only folders
  rationale: the per-feature 12-folder shape (see CODING.yaml per_feature_structure) is a MAXIMUM, not a minimum. Use only the sub-folders the feature actually needs; collapse the rest.
  enforced_by: scripts/verify/verify-no-padding-folders.mjs (part of pnpm verify chain)

# ---------- cross-references (single source of truth) ----------
# These topics live in their canonical standards file; this section is
# the pointer so agents don't need to scan multiple yamls.

writing_order: see STANDARDS_COMPLIANCE.yaml
editing_locked: see STANDARDS_COMPLIANCE.yaml
test_coverage: see TESTING.yaml
verification: see STANDARDS_COMPLIANCE.yaml

workflow_owners:
  spec_phase: spec-writer agent
  code_phase: coder agent
  verify_phase: verifier agent
  orchestration: PM agent (when present) OR orchestrator
  see: AGENT_ARCHITECTURE.md

