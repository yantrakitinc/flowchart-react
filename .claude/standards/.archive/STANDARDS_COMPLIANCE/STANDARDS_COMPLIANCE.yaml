version: 4

# Rationale lives in STANDARDS_COMPLIANCE.detail.md. This file carries only
# what an agent needs to APPLY and ENFORCE.

# ---------- per-feature lock file ----------

file:
  name: standards-compliance.yaml
  location: <feature>/__specs__/standards-compliance.yaml
  required_in: every folder containing __specs__/
  minimal_by_design: required fields ONLY — never pad with spec/flows/tests/manual/notes; verifiers read only status/verified/last_validated; history lives in the changelog (changelog.mdx) + git, not here

schema:
  status: enum[locked, unlocked]            # "locked" at compliant-tag time
  verified: enum["100%"]                    # ONLY value; no fractional compliance
  last_validated: iso8601_datetime          # UTC, e.g. 2026-05-20T04:06:03Z
  feature: path                             # path to feature folder from repo root
  standards: map                            # EVERY standard registered in INDEX.yaml, none omitted;
                                            # per-standard verdict enum: "100%" | "NOT REQUIRED (<reason>)".
                                            # Deliberate stamping — a missing standard or any other verdict
                                            # fails verify-standards-compliance.

# ---------- per-feature standards exception (optional, opt-in) ----------

exception_file:
  name: exception.yaml
  location: <feature>/__specs__/exception.yaml
  required_in: none — present ONLY when a justified, case-by-case waiver is needed; the escape hatch of last resort, never a default bar-lowering
  schema:
    exceptions: 'list of { rule: <verifier/check id, e.g. verify-component-tokens>, reason: <REQUIRED — why this case warrants the waiver>, approved_by: <who signed off — the user>, added: <iso8601_date> }'
  enforcement: every verifier loads <feature>/__specs__/exception.yaml (via _load-exceptions.mjs); a violation whose `rule` matches an exception is SKIPPED and logged as an accepted exception with its reason — never silently, never without a `reason`; no file or no matching entry → the gate fails as normal

# ---------- writing order (greenfield feature) ----------
# Full handoff lifecycle: ~/.claude/agents/AGENT_ARCHITECTURE.md. The three
# phases map to the spec-writer / coder / verifier agent split.

writing_order:
  spec_phase:
    owner: feature-spec-writer
    output: __specs__/{spec.yaml, spec.md, flows/, manual/ for EVERY HTTP|UI surface (mandatory; never omitted), ui/ if UI surface, openapi.yaml if HTTP, asyncapi.yaml if events}
    hands_off_to: coder
    steps:
      1: write __specs__/spec.yaml AND __specs__/spec.md
      2: write __specs__/flows/<fn>.flow.yaml for every exported function
      3: write __specs__/openapi.yaml if invocation.type=http
      4: write __specs__/asyncapi.yaml if folder emits/subscribes events
      5: 'write __specs__/manual/<flow>.md for EVERY HTTP / CLI / UI surface — MANDATORY, never skipped. A RUNNABLE adversarial flow (copy-paste into the Claude Code Chrome extension; drives the surface, POSTs results to /api/v1/manual-results/<flow>, prints them), NOT a copy of flows/ or the tests. Markdown only; five sections (Target/Preconditions/Steps/Assertions/Report); >= 1 "MUST NOT" assertion. NO automated-complete escape hatch, NO .yaml form — "tests already cover it" is non-compliant; an absent flow for a callable surface is non-compliant. See AGENT_STANDARDS.yaml manual_md + manual_flow_surfaces.'
      6: 'write __specs__/ui/<flow>.md if invocation.type in (ui, server-action) AND spec.yaml.ui_design != not-applicable; route to user for sign-off; user inserts `<!-- ui-locked: YYYY-MM-DD -->` marker in each file after approving (spec-writer NEVER self-signs)'
      7: drop __specs__/ui/<flow>.design-<state>.png for every state declared in <flow>.md (one PNG per state); user exports from any design tool and commits; filename convention is the contract
    blocks_coder_phase_until: |
      Path 1: every required __specs__/ui/<flow>.md carries `<!-- ui-locked: YYYY-MM-DD -->` (enforced by verify-ui-design-locked.mjs). Coder phase cannot start without this.
      Path 2 is checked at verify-phase: every required __specs__/ui/<flow>.design-<state>.png scores ≥ ui_screenshot_match_threshold against the Puppeteer screenshot of the matching state (enforced by verify-ui-screenshots-match-designs.mjs). Verifier Mode A cannot stamp the lock without this.
      Features with spec.yaml.ui_design: not-applicable skip BOTH paths; a one-line reason in spec.md is required.
  code_phase:
    owner: coder
    output: source + __tests__/ (red/green TDD with targeted runs allowed)
    dialogue_required_with: feature-spec-writer (when spec is unclear / contradictory / suboptimal)
    hands_off_to: verifier
    steps:
      1: write the code (driven by the specs)
      2: add JSDoc on every exported function (1-3 lines; detail lives in spec)
      3: write __tests__/<code>.test.ts — 100% coverage required (perFile)
      4: run targeted `pnpm vitest run <slice-path>` for red/green TDD; NEVER run full verify chain
  verify_phase:
    owner: verifier
    mode: A
    output: __specs__/standards-compliance.yaml stamped on green (status:locked, verified:100%, last_validated:<utc-now>)
    on_green: orchestrator may tag compliant/<sha> (see compliant_tag)
    on_fail: drive-to-green loop (see verify_phase_drive_to_green)

  verify_phase_drive_to_green:
    owner: orchestrator (Claude Code session OR pm agent OR verifier-core dispatcher)
    max_attempts: 5
    behavior:
      on_fail_attempt_lt_max: |
        1. capture verifier's reproduction block verbatim
        2. capture attempt counter (N of MAX)
        3. re-dispatch coder with reproduction + counter
        4. coder iterates source/tests to address EVERY failure in the reproduction
        5. re-dispatch verifier Mode A
        6. increment attempt counter; reset on green
      on_fail_attempt_eq_max: |
        SURFACE to user — do not iterate further. Surface contents:
        - all 5 attempts' verifier reproduction blocks (verbatim)
        - all 5 attempts' coder change-summary (file paths + 1-line per change)
        - the unchanging root cause (best-guess from the orchestrator)
        - ask: "spec gap? environmental issue? human design call needed?"
      on_green: stamp + proceed per writing_order.verify_phase
    counters: per-slice (per branch + per feature-path); reset on green; reset on user-triggered "start over"
    forbidden:
      - skipping any verifier output between attempts (never paraphrase the reproduction to the coder)
      - swallowing FAIL silently (the user MUST see attempt 5 surface)
      - bumping max_attempts past 5 without user authorization

# ---------- editing a locked feature ----------

editing_locked:
  shape: same three phases as writing_order (spec_phase → code_phase → verify_phase)
  spec_phase_start: set standards-compliance.yaml status=unlocked
  steps:
    1: set status=unlocked
    2: feature-spec-writer updates __specs__/spec.yaml + __specs__/spec.md + flows/ + manual/
    3: coder updates source + __tests__/ (100% maintained)
    4: verifier Mode A re-runs targeted gates on the slice + blast radius
    5: verifier re-stamps standards-compliance.yaml (status=locked, last_validated=<now-utc>) on green
    6: orchestrator commits; emits new compliant/<sha> tag on green Mode D

forbidden:
  - editing code before updating the spec
  - coder silently deviating from the spec
  - coder running pnpm verify / typecheck / lint / coverage as a release gate
  - skipping verifier Mode A on a slice
  - bumping last_validated without a real walk

# ---------- coverage policy ----------

test_coverage:
  threshold: 100%                           # lines / branches / functions / statements
  cant_reach_100_percent: split the file or refactor for testability
  skip_exception: physically or mathematically impossible only
  banned_excuses:
    - too long
    - too many tests required
    - improbable

# ---------- verify gates ----------

verification:
  per_rule_grep_gates: forbidden
  shape_check:
    script: verify-standards-compliance
    rule: every folder containing __specs__/ has __specs__/standards-compliance.yaml
    asserts:
      - status == "locked"
      - verified == "100%"
      - last_validated is a valid ISO-8601 UTC datetime
    runtime: fast
    runs_in: pnpm verify (every push)
  freshness_check:
    rule: most recent commit touching the feature folder (excluding the lock file itself) ≤ standards-compliance.yaml.last_validated + same_commit_grace_ms
    signal: 'git log -1 --format=%aI -- <feature-folder> :(exclude)<lock-relative-path>'
    NOT: filesystem mtime — git operations reset mtime; only git history is the truth
    same_commit_grace_ms: 1800000           # 30 min — covers the gap between coder finishing and verifier stamping in the same commit
    on_fail: feature is stale; verifier Mode A walk + re-stamp required
    runtime: slow (one git call per lock)
    runs_in: pnpm verify:full + verifier Mode B + Mode D

# ---------- core verifier mode semantics (A–E) ----------
# This file owns the SEMANTICS of the core modes only. The full 15-mode
# catalog has a single owner: GITFLOW.yaml.verifier_modes.

verifier_modes:
  full_mode_catalog: GITFLOW.yaml.verifier_modes
  A:
    name: slice-on-commit
    when: coder finishes a slice; orchestrator routes the handoff
    scope: just-written code + blast radius (callers, callees, tests, specs)
    runs:
      - targeted `pnpm vitest run <blast-radius-paths>` (NOT full suite)
      - "`pnpm typecheck` (whole-project — TS doesn't scope cleanly)"
      - "`pnpm lint <blast-radius-paths>` (scoped)"
      - PRIMARY RULE boundary greps against the slice's DB code
      - verify-manual-playbooks: a runnable .md flow EXISTS + is valid for each new surface (authoring is the per-slice gate; RUNNING the flows is the Mode E ritual)
      - flow doc / test cross-reference for slice's flows
    on_green: stamp standards-compliance.yaml (status:locked, verified:100%, last_validated:<utc-now>)
    default_execution: INLINE (Claude Code reads ~/.claude/agents/verifier.md and runs it)
  B:
    name: push-time stamp check
    when: every routine push
    scope: stamps only — no code execution
    runs:
      - shape_check (per-lock presence + status:locked + verified:100% + valid ISO-8601 UTC)
      - freshness_check (git-history-based)
    stamps: NO — Mode B only reads stamps; never writes
    default_execution: INLINE
  C:
    name: push-time slice re-verify
    when: opt-in at final-push prompt (recommended for tricky features / major security implications / dependency-shifting changes)
    scope: every slice in this push, end-to-end
    runs: Mode A per slice
    stamps: YES — via the Mode A calls it spawns; each touched slice re-stamped on green
    default_execution: SUBAGENT (dispatch ~/.claude/agents/verifier-core.md with mode=C)
  D:
    name: full end-to-end
    when: opt-in at final-push prompt OR house_clean_trigger (25 commits / 7 days since last D)
    scope: whole repo
    runs:
      - "`pnpm typecheck`"
      - "`pnpm lint`"
      - "`pnpm verify:full` (all standards-side verify scripts)"
      - "`pnpm test:coverage` (full suite + coverage)"
      - cross-reference every flow doc / manual playbook against tests (project-wide)
      - PRIMARY RULE grep checks across the whole repo
    stamps: NO — Mode D verifies repo-wide health, NOT per-slice walks; stamping a per-slice lock requires Mode A (or Mode C orchestrating A per slice)
    default_execution: SUBAGENT (dispatch ~/.claude/agents/verifier-core.md with mode=D)
    on_green: eligible for `git tag compliant/<sha>` (orchestrator tags; verifier does not)
  E:
    name: manual QA pass (RUN the flows)
    when: pre-release / pre-tag ritual (NOT per-PR) — the hybrid half of manual-flow compliance
    scope: every __specs__/manual/<flow>.md in the repo
    runs:
      - boot the app locally (and Storybook too, for component QA flows)
      - 'drive each flow with the Claude Code Chrome extension (full autonomy): it executes the steps and POSTs results to the local-only /api/v1/manual-results/<flow> route'
      - 'the CLI agent reads manual-results/ and triages each flow: every assertion held AND nothing in the MUST-NOT list happened'
    stamps: NO — results live in the git-ignored manual-results/; this ritual gates a RELEASE, not a per-slice lock
    default_execution: human-triggered in the browser; the CLI agent reads + acts on the posted results
    note: authoring the flow is the per-PR gate (Mode A + verify-manual-playbooks); RUNNING it is Mode E. A FEATURE is compliant when the flow is authored; a RELEASE is QA-passed when Mode E is green.

stamping_authority:
  rule: only verifier Mode A writes last_validated; Mode C writes last_validated indirectly by spawning Mode A per slice
  mode_a: writes last_validated on green (slice-on-commit)
  mode_b: reads last_validated; never writes
  mode_c: spawns Mode A per slice — writes last_validated transitively
  mode_d: reads via freshness_check; NEVER writes last_validated — by design (Mode D verifies repo-wide health, not per-slice walks)
  on_mode_d_green_with_stale_stamps: legitimate — run Mode C to refresh stamps OR accept that locks reflect the last per-slice walk, not the latest repo-wide gate

# ---------- source coverage + spec fields ----------

source_coverage:
  rule: every .ts/.tsx under src/ resolves to __specs__/spec.yaml (walking up) OR a .ignore.specs.yaml marker
  marker_file: .ignore.specs.yaml
  marker_content:
    empty: deliberately exempt (cross-cutting)
    named: "feature_name: <parent-feature-name>"
  inheritance: closest marker wins (deeper overrides shallower)
  enforced_by: scripts/verify/verify-source-coverage.mjs

spec_yaml_feature_name:
  rule: 'every __specs__/spec.yaml has `feature_name: <kebab-case>` as its first top-level field; unique repo-wide'
  used_by: .ignore.specs.yaml resolution

spec_yaml_scope_authority:
  rule: optional spec.yaml field; one of {user, claude}; default "user"
  when_claude:
    coder_may_decide_without_asking:
      - helper extraction (private functions inside the feature folder)
      - internal field/column naming within the operation's domain
      - test fixture choice (placeholder names from CLAUDE.md "Placeholder names" convention)
      - log-key naming
      - private type-alias naming
    coder_must_still_surface:
      - invocation.type changes
      - public API shapes (request_schema / response_schema)
      - permission slugs
      - data destruction (DROP/DELETE/TRUNCATE)
      - third-party API choice
      - library / framework choice
      - any spec edit that alters behavior visible to a caller
  default_user_behavior: surface every in-scope decision per CLAUDE.md "Do exactly what is asked"
  enforced_by: coder agent reads the field at code-phase start; enum validation lives inline in the coder + spec-writer SOPs

one_operation_per_feature:
  rule: each feature owns exactly one operation
  enforced_by: the verifier agent at Mode A; coder + feature-spec-writer SOPs cite the allowlist when generating sub-folders
  subfolders_allowed_by_invocation_type:
    internal:       [db, mappers, types, validation, audit, mocks]
    http:           [services, handlers, types, validation, audit, mocks]   # + exactly 1 src/app/**/route.ts matching invocation.path
    server-action:  [actions, services, types, validation, audit, mocks]
    ui:             [components, services, types, validation, mocks]

standards_change_authority:
  rule: standards changes (any edit to ~/.claude/CLAUDE.md or ~/.claude/standards/*) always surface to the user for explicit approval; the agent never auto-patches standards mid-slice — not even for one-paragraph doc clarifications
  applies_to: ~/.claude/CLAUDE.md + ~/.claude/standards/*.{yaml,md,detail.md} + vendored copies
  procedure:
    1: surface the proposed change verbatim in the end-of-turn report
    2: user explicitly approves before the edit lands
    3: standards changes ship in their own focused PR, never bundled into a feature slice

# ---------- agent response when asked "100% compliant?" ----------

on_user_question:
  procedure: dispatch verifier (Mode D or B); quote its output verbatim
  reply_all_green: '"yes — last full verify <date>"'
  reply_any_stale: name failing folder(s) + reproduction

# ---------- compliant tag convention ----------

compliant_tag:
  format: compliant/<sha>
  emitted_when: green verifier Mode D OR every commit at which all features are 100% standards compliant
  purpose: revert anchor — last known 100% commit
  authority: orchestrator tags after verifier reports green; verifier does NOT tag itself

