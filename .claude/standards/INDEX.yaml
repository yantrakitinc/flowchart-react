version: 1

# Catalog of every standards file in ~/.claude/standards/.
# When the agent needs a rule, it reads this index, finds the relevant
# standard by `scope:`, then opens the .yaml. Detail.md is opened only
# when the rule's intent isn't obvious from the YAML.

standards:
  AUTHORIZATION_STANDARDS:
    md: AUTHORIZATION_STANDARDS.md
    rationale: AUTHORIZATION_STANDARDS.rationale.md
    scope: Layer A iAuthorizedPrincipal<TSlug> compile-time + Layer B Postgres RLS runtime + per-feature permission-slug catalog (db/permissions.ts) + central permissions-rules.yaml DSL + two-actor model (users + service_principals) + permission catalog + bootstrap chain

  COMPONENT_CREATION:
    md: COMPONENT_CREATION.md
    rationale: COMPONENT_CREATION.rationale.md
    scope: design-system primitives in src/components/ui/<Name>/ — 5-phase order (design → test → implement → stories → verify) + design.md lock marker + spec.yaml schema + shared state vocabulary (state-hover-*, state-focus-visible, state-disabled, state-loading) + token discipline + cross-variant cva consistency + 4 verifier scripts + pre-commit / pnpm verify / CI enforcement layers

  COMPOSITE_CREATION:
    md: COMPOSITE_CREATION.md
    rationale: COMPOSITE_CREATION.rationale.md
    scope: tier-2 composites (2+ atomics) — thin-spec doctrine + consumed_atomics locked_sha pinning + frozen_props + state propagation + focus order + 6-phase order + feature-local default location + promote-to-shared rule + composite verifiers

  PAGE_CREATION:
    md: PAGE_CREATION.md
    rationale: PAGE_CREATION.rationale.md
    scope: tier-3 pages/surfaces (route | sidepanel | popup | options | embedded) — thin-spec extension + landmark_structure + state_machine + seo_contract + performance_budget + wireframes + error/loading/not-found + page verifiers + blueprint_doc binding

  E2E_TESTING:
    md: E2E_TESTING.md
    rationale: E2E_TESTING.rationale.md
    scope: end-to-end tests — scenario/flow folder tree + UI/API parity + Setup/Actions/Assertions english specs + <flow>.yaml machine contract + placement by shared-truth boundary (mono spanning folder / poly center-of-gravity) + DB-safety (never real/remote, local-or-e2e-db only) + seed strategies (auto/button-wait/human) + run modes + attestations

  GOOGLE_FIREBASE_STANDARDS:
    md: GOOGLE_FIREBASE_STANDARDS.md
    rationale: GOOGLE_FIREBASE_STANDARDS.rationale.md
    scope: Firebase usage (Firestore / Storage / Analytics / Auth) — ZERO client-side SDK + NextAuth+Firebase auth path + project setup + permission-slug authorization (not email allowlists)

  INDUSTRY_STANDARDS_STACK:
    md: INDUSTRY_STANDARDS_STACK.md
    rationale: INDUSTRY_STANDARDS_STACK.rationale.md
    scope: named industry standards catalog — OpenAPI 3.1, AsyncAPI 3.0, OAuth 2.1, OIDC, WebAuthn, Argon2id, PASETO, NIST RBAC, OpenTelemetry, 12-factor, SOC 2, GDPR, OWASP ASVS L2, CIS Benchmarks, CUID2, etc.

  PACKAGE_PROJECT_STANDARDS:
    md: PACKAGE_PROJECT_STANDARDS.md
    rationale: PACKAGE_PROJECT_STANDARDS.rationale.md
    scope: published npm package repos — package/ layout + versioning + prepublish-check + CONFIRMED=1 publish gate + storybook deploy + README

  PROCESS_DISCIPLINE:
    md: PROCESS_DISCIPLINE.md
    rationale: PROCESS_DISCIPLINE.rationale.md
    scope: scope (code only what's asked) + defects (surface, never silently fix) + foundational ordering + DB hygiene + decision boundary (zero executive decisions) + pushback discipline + one-bug-one-PR + refactor-to-testability

  PROJECT_ARCHITECTURE:
    md: PROJECT_ARCHITECTURE.md
    rationale: PROJECT_ARCHITECTURE.rationale.md
    scope: single Next.js app shape (server/client layers, data access behind handlers) + transport-agnostic handlers + SSR-only authorization + gates check permissions never roles + CUID2 for PKs always + soft-delete with redaction + single source of truth via Zod + external/cross-service HTTP-only + phase-1 API+CLI (UI deferred)

  SITE_BLUEPRINT:
    md: SITE_BLUEPRINT.md
    rationale: SITE_BLUEPRINT.rationale.md
    scope: blueprint-before-site ordering — complete markdown site blueprint (docs/site/ — design language + routes/shell + API bindings + per-page docs + per-flow docs + coverage matrix with unmapped_stories 0) required BEFORE any page-tier slice; atomics/composites exempt; blueprint-locked marker + blueprint_lock_mode autonomy + blueprint_doc binding in page spec.yaml + verify-site-blueprint.mjs gate

  STANDARDS_CREATION_STANDARDS:
    md: STANDARDS_CREATION_STANDARDS.md
    scope: how to write a standard (two-file Markdown shape <NAME>.md rules + <NAME>.rationale.md why, fenced meta block, NAME#anchor citations, UPPER_SNAKE_CASE naming, what earns its own standard)

  SUPERPOWERS:
    md: SUPERPOWERS.md
    rationale: SUPERPOWERS.rationale.md
    scope: superpowers@claude-plugins-official plugin — slash commands + skill catalog + canonical workflow + output locations + plugin priority rule (standards beat skills)

  TEST_NAMING:
    md: TEST_NAMING.md
    rationale: TEST_NAMING.rationale.md
    scope: the foundation for both testing standards + the test-runner — every test has one stable path-derived ID (unit:<feature-path>/... , e2e:<scenario>/<flow>/<variant>) + e2e/unit/story filenames + seed dataset names + discovery globs + uniqueness rules; enables zero-hand-maintenance auto-discovery + orphan cleanup

  VERCEL_STANDARDS:
    md: VERCEL_STANDARDS.md
    scope: Vercel deploy policy — HARD RULE never trigger deploy from local (only path is git merge to main → webhook → Vercel) + preview deployments disabled per project via commandForIgnoringBuildStep + production branch = main + git fork protection + provisioning checklist + audit query

  ACCESSIBILITY:
    md: ACCESSIBILITY.md
    rationale: ACCESSIBILITY.rationale.md
    scope: WCAG 2.2 AA bar, APG pattern requirement, axe test-runner gate, data-axe-exception waivers

  AGENT_AFFORDANCES:
    md: AGENT_AFFORDANCES.md
    rationale: AGENT_AFFORDANCES.rationale.md
    scope: Agent-visible surface — /agents.json + /agents.txt generation, data-testid/data-agent-*/aria-label attrs, action-verb catalog, /llms.txt

  API_SURFACE:
    md: API_SURFACE.md
    rationale: API_SURFACE.rationale.md
    scope: Server-action-to-HTTP parity, /api/v1 versioning, /openapi.json + /docs runtime surfaces, visibility gates + apiMeta

