    md: FLOW_CONTRACT.md
    rationale: FLOW_CONTRACT.rationale.md
    scope: flows/<fn>.flow.yaml — schema + exhaustive path enumeration (happy/error_*/edge_*, KNOWN-NOT-VALIDATED) + error_terminal (every error path ends at a user-facing explanation + alternative when warranted) + set-level journey_completeness (bidirectional — every journey step→flow AND every flow→journey; explained-failure terminal = valid coverage; orphan flow = hard red)

  USER_JOURNEYS:
    rationale: USER_JOURNEYS.rationale.md
    md: USER_JOURNEYS.md
    scope: outside-in user-journey catalog (docs/journeys/) + circular discover→match→reconcile→update loop run BEFORE code — journeys modeled from SaaS domain + peer apps BLIND to our flows (repo-blind journey-cartographer-core subagent) + required provenance + dual-outcome (journey achieved by success OR well-explained failure; failure_outcomes + alternatives) + bidirectional journey↔flow reconciliation (00-INDEX map) + blind traversal audit (flow-traversal-auditor-core walks a domain-only goal using ONLY docs/flows; REPEATED down a likelihood×importance×traffic priority order until unreachable_goals=0 AND priority_goals_uncovered=0) + journeys feed user-locked REQUIREMENTS + verify-journeys.mjs gate

  LABS:
    rationale: LABS.rationale.md
    md: LABS.md
    scope: computer-wide /labs visual sandbox — flow-backed surfaces (bidirectional flow↔labs map, binary; unbacked_surfaces=0 AND uncovered_flows=0) + placement-agnostic (route | separate_app | hybrid, per-project .standards/labs.yaml) + Explore/Refine tiers (Explore free-form, Refine adopts DESIGN_TOKENS+STATE_VOCABULARY) + hard rules (flow-backed, mobile/PWA-first, full real estate, auto-play-able) + feedback protocol (collect+answer, no edits until "apply", triage flow-vs-cosmetic, flows-first-then-UI, YAML tally + generated MD, gate blocks promotion while a flow-affecting item is open) + extended-Mermaid in-app JS/React auto-play player (visual demo not E2E, any browser+mobile, single-origin with flow.yaml, symmetric play/record) + verify-labs.mjs gate

