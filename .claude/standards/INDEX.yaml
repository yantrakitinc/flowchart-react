# ---------- Tier-1 hub ----------

tier_1_entry: STANDARDS_ENTRY.md                  # always-needed rules + per-standard router

# ---------- agent ecosystem ----------
# Locked design: ~/.claude/agents/AGENT_ARCHITECTURE.md.
# Each agent ships in two files:
#   <agent>.md       — Claude Code SOP, read inline (full doctrine)
#   <agent>-core.md  — dispatchable subagent (the 5%); registered via `name:` frontmatter

agents:
  location: "~/.claude/agents/"
  architecture_doc: AGENT_ARCHITECTURE.md
  ecosystem:
    pm:
      full: pm.md
      core: pm-core.md
      role: project state + orchestration; routes typed commands to specialists
    feature-spec-writer:
      full: feature-spec-writer.md
      core: feature-spec-writer-core.md
      role: writes per-feature __specs__/spec.yaml + spec.md + flows + manual; locks spec
    coder:
      full: coder.md
      core: coder-core.md
      role: implements against locked spec; targeted red/green TDD only; never runs full verify chain
    verifier:
      full: verifier.md
      core: verifier-core.md
      role: 4-mode verifier (A/B inline; C/D subagent); owns the lock stamp
    github-project-agent:
      full: github-project-agent.md
      core: github-project-agent-core.md
      role: GitHub Issues + Projects mechanics; reads README.yaml for per-repo bindings

  support_agents:                                  # token-cheap precision agents; strict output contracts
    standards-auditor-core:
      core: standards-auditor-core.md
      role: audits the standards tree (meta-linter + no-history + parse sweep + dirty-tree); verbatim output only; haiku
    standards-reconciler-core:
      core: standards-reconciler-core.md
      role: finds contradictions/duplications/stale refs between standards; read-only report with file:line quotes; dispatch before+after editing any standard
    gate-runner-core:
      core: gate-runner-core.md
      role: runs project gates and returns only verbatim final lines + failures; keeps gate spam out of the main session; haiku
    proposal-miner-core:
      core: proposal-miner-core.md
      role: mines DECISIONS + LESSONS for patterns; outputs standard-change proposals with citations; never edits; user ratifies
    ui-walker-core:
      core: ui-walker-core.md
      role: executes real-browser UI walks (Chrome extension) per manual flows + Verify-Manual + Playground two-way; strict verdict report; never stamps
    journey-cartographer-core:
      core: journey-cartographer-core.md
      role: DISCOVER phase of the user-journey loop — generates the outside-in journey catalog (docs/journeys/) from ONLY domain + peer scan; repo-blind by toolset (no Read/Grep/Glob) so it cannot mirror our flows; sonnet

  inline_first_doctrine:
    rule: Claude Code (active session) executes routine work directly by reading <agent>.md as SOP
    dispatch_when:
      - reproducibility exercise (fresh agent given ONLY the locked spec)
      - parallel independent investigation
      - bulk / sweep / audit (>5 targets)
      - heavy verifier modes (C / D)
    cost_signal: subagent dispatch ~7x inline tokens; reserve for the 5%

# ---------- lookup helpers ----------

how_to_use:
  rule: open this file first when the agent needs to find a standard or agent
  procedure:
    1: for rules → scan standards `scope:` strings; find the standard matching the question; open its `md:` (the rules)
    2: for agent behavior → open `~/.claude/agents/<agent>.md` (inline SOP) or `<agent>-core.md` (dispatch target)
    3: open the `rationale:` file only when the rules' intent isn't obvious

# ---------- pairs at-a-glance ----------

count:
  total_standards: 66                            # registered here; each ships <NAME>.md (rules) + <NAME>.rationale.md (why)
  md_only_exception: 1                           # STANDARDS_CREATION_STANDARDS (the meta-rule; rules-only, no rationale file)
  agent_files: 14                                # AGENT_ARCHITECTURE.md + 5 × (<agent>.md + <agent>-core.md) + 3 support *-core.md

