flow: FlowChart (node-click interaction)
kind: composition-root
source: src/react/FlowChart.tsx
symbol: FlowChart

inputs:
  onNodeClick: "((nodeId: string, data: iFlowNodeData) => void)? — fired when a rendered node is clicked"
  activeNodeId: "string? — caller-controlled; the clicked node is NOT automatically marked active by this flow (the caller decides, typically by feeding the clicked id back in via activeNodeId)"

returns:
  - "void — invokes the onNodeClick callback prop with (node.id, node.data); there is no return value observable by the caller other than the callback invocation"

throws: []

calls:
  - "React Flow's onNodeClick wiring (@xyflow/react NodeMouseHandler, passed as the `onNodeClick` prop to <ReactFlow>)"

called_by:
  - "React Flow (internal library event dispatch) in response to a real DOM click/tap on a rendered node"

emits_events: []

side_effects_on_success:
  - "invokes the onNodeClick(nodeId, data) callback prop with the node's full current iFlowNodeData (label, type, direction, description?, active, onSelectedPath, dimmed, and any custom passthrough fields from iFlowNode.data)"
  - "no internal state changes — activeNodeId is entirely caller-controlled, not self-managed by this component"

side_effects_on_failure: "none — clicking is a safe no-op when onNodeClick is not supplied (optional chaining: `onNodeClick?.(...)`)"

transaction: "none"

test: src/react/FlowChart.test.tsx
spec: src/react/__specs__/spec.yaml

ai_agent_action:
  when_to_call: "the user wants to react to a node being clicked/selected — e.g. open a detail panel, navigate, or mark the node active by feeding its id back into activeNodeId"
  when_not_to_call: "no click-driven behavior is needed — omit onNodeClick entirely; nodes still render and are still clickable in the DOM, they simply produce no callback"
  natural_language_examples:
    - "when I click a node, show its details"
    - "highlight the clicked node as active"
    - "navigate somewhere when this step is clicked"
  agent_invocation: "UI nav — pass an onNodeClick prop to <FlowChart>; the callback fires from a real DOM click/tap on a rendered node (data-node-id=\"<id>\", data-agent-action=\"select-node\"), not an HTTP call"
  confirm_with_user_before: "none — read-only selection notification, no data mutation"
  summarize_to_user_after: "Node '<nodeId>' clicked; forwarded to onNodeClick with its current render data (type, label, active/dimmed/onSelectedPath flags)"

paths:
  happy:
    - "layout has resolved; nodes are rendered as real DOM elements (div[data-node-id], data-agent-action=\"select-node\")"
    - "user clicks a node's DOM element"
    - "React Flow's NodeMouseHandler fires with (event, node)"
    - "handleNodeClick extracts (node.id, node.data as iFlowNodeData)"
    - "onNodeClick(nodeId, data) is invoked with the full data payload"

  edge_boundary_no_handler_supplied:
    - "onNodeClick prop is undefined"
    - "a click still reaches handleNodeClick, but `onNodeClick?.(...)` short-circuits to a no-op"
    - "no crash, no callback, no visible state change"

  edge_boundary_click_before_layout_resolves:
    - "positioned is still null (the layout effect's promise has not resolved yet)"
    - "only the 'Laying out…' placeholder div (data-agent-action=\"loading\") is rendered — no <ReactFlow> and no node elements exist in the DOM yet"
    - "there is nothing clickable; the node-click surface does not exist until layout resolves"

  edge_boundary_expand_toggle_click_does_not_bubble:
    - "the node has a description, so FlowNode renders its expand/collapse '+/−' button (data-agent-action=\"toggle-description\")"
    - "user clicks that button"
    - "the button's onClick calls `e.stopPropagation()` before toggling local expanded state"
    - "the click never bubbles up to React Flow's node-click dispatch — expanding a node's description is distinguishable from selecting/clicking the node, and does not fire onNodeClick"

mermaid: |
  flowchart TD
    L{layout resolved?}
    L -->|no| PLACE[Laying out placeholder — nothing clickable]
    L -->|yes| N[node rendered: data-node-id, data-agent-action=select-node]
    N --> C[user click]
    C --> EXPAND{clicked the +/- expand button?}
    EXPAND -->|yes| STOP[stopPropagation — toggles description only]
    EXPAND -->|no| MH[React Flow NodeMouseHandler fires]
    MH --> H{onNodeClick supplied?}
    H -->|yes| CB[onNodeClick(nodeId, data)]
    H -->|no| NOOP[no-op]
