flow: usePaths
kind: helper
source: src/react/usePaths.ts
symbol: usePaths

inputs:
  graph: "iFlowGraph — the graph to detect start→end paths over"
  controlledId: "string|null|undefined — when defined (including explicitly `null`), the hook operates in controlled mode"
  onChange: "((id: string|null) => void)? — fired on every selection change, controlled or not"

returns:
  - "iUsePathsResult — { paths: iFlowPath[], detection: iPathDetectionResult, selectedPathId: string|null, selectedPath: iFlowPath|null, setSelectedPathId: (id) => void }"

throws: []

calls:
  - "detectPaths (../paths/detectPaths)"

called_by:
  - "FlowChart (./FlowChart.tsx)"
  - "any consumer building a custom path-selector UI (usePaths is exported standalone)"

emits_events: []

side_effects_on_success:
  - "in uncontrolled mode (controlledId === undefined), updates its own internal selectedPathId state"
  - "always invokes the onChange callback when setSelectedPathId is called, whether controlled or not"

side_effects_on_failure: "none — detectPaths always returns a (possibly empty) result; there is no failure mode"

transaction: "none"

test: "src/react/branches.test.tsx (usePaths unit behavior) + src/react/FlowChart.test.tsx (drawer selection integration)"
spec: src/react/__specs__/spec.yaml

ai_agent_action:
  when_to_call: "a consumer wants to build a custom path-selector UI instead of the built-in PathDrawer, or needs the raw list of detected start→end paths and their classification"
  when_not_to_call: "the default FlowChart + PathDrawer wiring already covers the need — mount <FlowChart showPathDrawer /> instead of wiring usePaths by hand"
  natural_language_examples:
    - "give me the list of paths through this flowchart"
    - "let me build my own path picker"
    - "which path is currently highlighted"
    - "clear the path selection"
  agent_invocation: "internal — a React hook, not directly callable outside a React component tree; exercised via UI nav (click a row in the rendered PathDrawer) or by a custom component calling the hook"
  confirm_with_user_before: "none — read-only selection state, no data mutation"
  summarize_to_user_after: "Detected <paths.length> path(s); currently selected: <selectedPath?.name ?? 'none'>"

paths:
  happy:
    - "the drawer is rendered with N detected paths (uncontrolled mode: no selectedPathId prop passed to FlowChart)"
    - "user clicks a path row (data-agent-action=\"select-path\", data-path-id=\"<id>\")"
    - "PathDrawer's onClick calls onSelect(id); usePaths' setSelectedPathId(id) updates internal state (not controlled) and calls onChange(id)"
    - "the clicked row now carries aria-selected=\"true\" and the `is-selected` class; matching nodes/edges elsewhere in the graph gain onSelectedPath=true and lose dimmed, all others gain dimmed=true"

  edge_boundary_zero_paths_detected:
    - "the graph has no traversable start→end route (e.g. a single node with no edges is still surfaced as a synthetic single-node path by detectPaths, but a graph with zero nodes yields zero paths)"
    - "detectPaths returns { paths: [] }"
    - "PathDrawer receives paths=[] and returns null — no drawer element exists in the DOM at all, even if showPathDrawer is true"

  edge_boundary_reselect_clears_selection:
    - "user clicks the row that is already selectedPathId"
    - "PathDrawer's onClick computes `selectedPathId === p.id ? null : p.id`"
    - "onSelect(null) is called — clicking a selected path a second time deselects it (toggle-off), it does not re-select the same path"

  edge_boundary_controlled_with_explicit_null:
    - "FlowChart is given `selectedPathId={null}` (not omitted/undefined)"
    - "isControlled evaluates true because `controlledId !== undefined` is true for `null`"
    - "the hook is in controlled mode with 'no selection'; clicking a path still calls onChange(id), but internal state is never touched — the row will NOT visually select until the consumer feeds the new id back through the selectedPathId prop"
    - "a consumer who forgets to sync the prop from onPathChange sees a drawer that looks unresponsive to clicks (by design of controlled mode, not a bug)"

  edge_boundary_cyclic_or_oversized_graph:
    - "the graph's DFS-enumerable path count would exceed MAX_PATHS=50, or a route would exceed MAX_DEPTH=100 hops (e.g. a large or cyclic graph)"
    - "detectPaths' internal dfs() stops adding results once `results.length >= MAX_PATHS` or `depth > MAX_DEPTH`, silently omitting any paths beyond the cap"
    - "KNOWN-NOT-VALIDATED: a flowchart-scale diagram large/cyclic enough to hit either cap is an unusual authoring mistake for this package's intended use — no current test exercises the cap; acceptable given the caps exist purely as a defensive backstop against a pathological/cyclic graph making DFS enumeration unbounded, not as a documented user-facing limit."

mermaid: |
  flowchart TD
    G[iFlowGraph] --> DP[detectPaths]
    DP --> R{paths.length}
    R -->|0| NULL[PathDrawer renders null]
    R -->|>0| LIST[drawer lists every path]
    LIST --> CLICK[user clicks a path row]
    CLICK --> CTRL{isControlled?}
    CTRL -->|no| INT[update internal selectedPathId + onChange]
    CTRL -->|yes| EXT[onChange only; awaits prop update from consumer]
    CLICK --> TOGGLE{already selected?}
    TOGGLE -->|yes| DESELECT[onSelect null]
    TOGGLE -->|no| SELECT[onSelect id]
