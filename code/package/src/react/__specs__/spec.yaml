feature_name: react
scope_authority: user

operation:
  name: "Render an interactive flowchart"
  slug: "(public)"
  description: "Parse Mermaid-like text or an IR graph, lay it out asynchronously, and render it as an interactive React Flow diagram with a semantic node-type registry, semantic edge styling, and an optional path-selector drawer."

invocation:
  type: ui
  path: "import { FlowChart } from '@yantrakit/flowchart-react'"
  request_schema: "iFlowChartProps (src/react/types.ts) — exactly one of `chart` (Mermaid-like DSL string) or `graph` (iFlowGraph IR object) is required"
  response_schema: "JSX.Element — either the rendered fc-root (React Flow canvas + optional path drawer) or the role=alert parse-error box"

chat_agent:
  when_to_call: "the user supplies flowchart-shaped content (Mermaid-like DSL text or an iFlowGraph IR object) and wants it rendered as an interactive, clickable diagram inside a React application"
  when_not_to_call: "there is no React host to mount into, or the target output is a static image/SVG export with no interactivity"
  natural_language_examples:
    - "render this flowchart so users can click through it"
    - "show this process as an interactive diagram with a path selector"
    - "turn this Mermaid text into a live React component"
  confirm_before: "none — read-only rendering, no data mutation"
  summarize_after_success: "Rendered a <nodeCount>-node / <edgeCount>-edge flowchart with <pathCount> detected path(s)."
  summarize_after_failure: "Flowchart failed to parse: <error.message> (line:column)."

cross_cutting:
  wcag: "role=alert on the parse-error box; role=listbox + aria-selected on the path drawer's option list; aria-label on every node (\"<type> node: <label>\") and on the drawer, expand toggle (aria-expanded), and every drawer button; every interactive element is a native <button> (no image-only, hover-only, or focus-trap widgets authored by this package). React Flow's own node wrapper (outside this package) supplies keyboard focus/selection for the canvas graph itself."
  auth: "n/a — public client-only rendering component; no principal, no permission check, no DB. Authorization is entirely the host application's concern (out of this package's scope)."
  mobile: "no fixed-viewport breakpoints authored — .fc-root/.fc-canvas use fluid flex/percentage sizing (width:100%, flex:1 1 auto) and the container's height is caller-supplied (height prop, default 480), so the canvas fits any width/height the host allots. The path drawer has a fixed 200px width when positioned left/right and a 140px max-height when positioned top/bottom; on narrow viewports the host is expected to pass pathDrawerPosition='top'|'bottom' or showPathDrawer={false} — this package does not auto-switch drawer position by viewport width."
  i18n: "n/a — every end-user-visible diagram string (node labels/descriptions, edge labels) is caller-supplied and inherits the host app's own i18n layer. The only 3 package-authored strings ('Laying out…', 'Flowchart parse error', 'All paths') are developer-facing rendering-library chrome, not localizable end-user product copy; no i18n layer is wired for them in this package."

authorization:
  layer_a_brand: "n/a — no DB/service boundary; this is a client-only rendering component"
  rls_directive: "n/a — no database"
  policies: []
  permission_slugs_used: []
  rls_deny_test: "n/a — read-only client rendering, no DB, no principal"

links:
  flows:
    - src/react/__specs__/flows/render-flowchart.flow.yaml
    - src/react/__specs__/flows/select-path.flow.yaml
    - src/react/__specs__/flows/click-node.flow.yaml
  tests:
    - src/react/FlowChart.test.tsx
    - src/react/branches.test.tsx
  manual:
    - src/react/__specs__/manual/render-flowchart.md
    - src/react/__specs__/manual/select-path.md
    - src/react/__specs__/manual/click-node.md

ui_design: not-applicable
