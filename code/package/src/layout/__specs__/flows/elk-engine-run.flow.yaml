flow: elkEngine.run
kind: service-method
source: src/layout/elkEngine.ts
symbol: elkEngine

inputs:
  graph: "iFlowGraph — nodes[] and edges[] to lay out"
  ctx: "iEngineContext — { direction, nodeWidth, nodeHeight, rankSpacing, nodeSpacing }, all resolved"

returns:
  - "Promise<iPositions> — Map<nodeId, {x,y}> built from ELK's laidOut.children[] (ELK returns absolute top-left coordinates directly, no center conversion needed)"

throws:
  - "Error — propagated verbatim from loadElk() when the 'elkjs' optional peer dependency cannot be imported"

calls:
  - "loadElk() (default dynamic import of elkjs/lib/elk.bundled.js)"
  - "new ELK()"
  - "elk.layout({ id, layoutOptions, children, edges })"

called_by:
  - "layout() when the caller explicitly passes { engine: elkEngine }"

emits_events: []

side_effects_on_success:
  - "none — the dynamically-imported ELK module is memoized by the JS module loader, not by this code; returns a fresh Map"

side_effects_on_failure: "none — the returned promise rejects with loadElk's error; nothing is written"

transaction: none

test: src/layout/engines.test.ts
spec: src/layout/__specs__/spec.yaml

ai_agent_action:
  when_to_call: "Passed explicitly as options.engine to layout() when a denser/alternative layout algorithm than dagre is wanted."
  when_not_to_call: "The 'elkjs' optional peer dependency is not installed in the consuming app — calling this without it installed causes layout() to reject."
  natural_language_examples:
    - "use ELK instead of dagre"
    - "try a different layout algorithm"
  agent_invocation: "internal — passed as `{ engine: elkEngine }` to layout(); not called directly"
  confirm_with_user_before: "none — read-only, pure computation (aside from the dynamic import)"
  summarize_to_user_after: "n/a — summarized at the layout() call site"

paths:
  happy:
    - "elkDirection(ctx.direction) maps TD->DOWN, BT->UP, LR->RIGHT, RL->LEFT"
    - "loadElk() resolves the ELK constructor; `new ELK()` constructs an instance"
    - "elk.layout() is called with layoutOptions (elk.algorithm: 'layered', elk.direction, nodeNodeBetweenLayers spacing, nodeNode spacing), children built from graph.nodes (id/width/height), and edges filtered to only those whose from/to both exist in graph.nodes"
    - "each child in the resolved laidOut.children[] is set into the returned Map keyed by its id, using its x/y as-is (ELK already reports top-left, unlike dagre's centers)"
  error_elkjs_missing:
    - "loadElk() rejects because the dynamic import of 'elkjs/lib/elk.bundled.js' failed (package not installed)"
    - "the rejection propagates unchanged out of elkEngine.run() (no try/catch here — loadElk already produces the clear, actionable message)"
  edge_direction_mapping:
    - "each of TD/BT/LR/RL is exercised and mapped to ELK's DOWN/UP/RIGHT/LEFT respectively"
  edge_dangling_edge_filtered:
    - "an edge whose from or to references a node id absent from graph.nodes is excluded from the edges[] array sent to elk.layout() — same double `graph.nodes.some(...)` guard as dagreEngine"
  edge_missing_child_position:
    - "ELK omits a requested child from laidOut.children (not observed in practice, but the code contains no assumption otherwise) — that node id is simply absent from the returned Map; layout()'s own `?? {0,0}` fallback (see layout.flow.yaml edge_missing_position_defaults) is what supplies a default, not this engine — KNOWN-NOT-VALIDATED: ELK's contract is to return every requested child; no test forces ELK itself to omit one, since doing so would require faking the whole elkjs surface rather than exercising real behavior"

mermaid: |
  flowchart TD
    A[elkEngine.run graph, ctx] --> B{loadElk succeeds?}
    B -->|no| C[reject with elkjs-missing error]
    B -->|yes| D[new ELK instance]
    D --> E[build layoutOptions from ctx: algorithm, direction, spacing]
    E --> F[build children from graph.nodes]
    F --> G[filter edges to those with both endpoints present]
    G --> H[await elk.layout root, layoutOptions, children, edges]
    H --> I[map laidOut.children -> Map id -> x,y]
