feature_name: layout
version: 1

owns:
  - code/package/src/layout/types.ts
  - code/package/src/layout/layout.ts
  - code/package/src/layout/dagreEngine.ts
  - code/package/src/layout/elkEngine.ts
  - code/package/src/layout/index.ts

operation:
  name: "Layout an IR graph to positioned geometry"
  slug: "(internal)"
  description: "Maps an iFlowGraph (the parsed/authored IR) to an iPositionedGraph — x/y positions + sizes for every node, renderer-neutral edges — via a pluggable layout engine (dagre by default, ELK opt-in)."

invocation:
  type: internal
  method: ""
  path: ""

chat_agent:
  when_to_call: "An agent (or the consuming React layer) holds an iFlowGraph (from parseFlowchart or hand-built IR) and needs on-screen x/y positions + sizes before rendering with React Flow (src/react)."
  when_not_to_call: "The graph is already positioned, or the caller only needs to manipulate/validate the IR (no rendering) — nothing here mutates or validates the IR itself."
  natural_language_examples:
    - "lay out this flowchart"
    - "auto-arrange the diagram left-to-right"
    - "use ELK instead of dagre for a denser layout"
    - "re-run the layout with wider node spacing"
  confirm_before: "none — read-only, pure computation, no side effects"
  summarize_after_success: "layout() returned <N> positioned nodes + <M> edges for direction <direction>."
  summarize_after_failure: "layout() rejected: <error message> (commonly: elkEngine chosen but 'elkjs' is not installed)."

cross_cutting:
  wcag: "n/a — pure geometry computation; no DOM/UI is rendered by this feature (the consuming src/react layer owns the rendered surface + its own WCAG contract)"
  auth: "n/a — no DB access, no principal, no permission-gated operation; layout() is a synchronous-style pure function over its inputs"
  mobile: "n/a — outputs numeric coordinates + sizes only; responsive/viewport concerns belong to the consuming React layer"
  i18n: "n/a — no user-facing strings originate here; node/edge labels pass through unchanged from the IR graph supplied by the caller"

links:
  flows:
    - ./flows/layout.flow.yaml
    - ./flows/dagre-engine-run.flow.yaml
    - ./flows/elk-engine-run.flow.yaml
    - ./flows/load-elk.flow.yaml
  tests:
    - ../layout.test.ts
    - ../engines.test.ts
  manual:
    - ./manual/layout.md
