feature_name: parse

scope_authority: user

# invocation.type=internal: this is a published library's public named exports,
# invoked via direct JS/TS import — not exposed over HTTP, not a UI route, not a
# server action. "internal" is the closest of the four SPEC_CONTRACT enum values;
# see spec.md for the one-line justification.
ui_design: not-applicable

operation:
  name: "Flowchart DSL compiler (parse + serialize)"
  slug: "(public)"
  description: >
    Compile Mermaid-like flowchart DSL text to the iFlowGraph IR (parseFlowchart)
    and render an iFlowGraph back to DSL text (serializeFlowchart).
    FlowchartParseError is the typed failure port for malformed input.

invocation:
  type: internal
  request_schema: >
    n/a — parseFlowchart(text: string, options?: iParseOptions);
    serializeFlowchart(graph: iFlowGraph). See src/parse/parseFlowchart.ts
    (iParseOptions) and src/ir/types.ts (iFlowGraph).
  response_schema: >
    n/a — parseFlowchart returns iFlowGraph; serializeFlowchart returns string.
    See src/ir/types.ts for iFlowGraph/iFlowNode/iFlowEdge.

chat_agent:
  when_to_call: >
    an agent/consumer has Mermaid-like flowchart DSL text and needs the typed
    iFlowGraph IR (e.g. before rendering with @yantrakit/flowchart-react, or
    before running path/layout analysis on it) — call parseFlowchart; or the
    agent has an iFlowGraph and needs DSL text to display, export, or save —
    call serializeFlowchart.
  when_not_to_call: >
    the caller already holds the target shape (already has an iFlowGraph and
    does not need text; or already has DSL text and does not need the IR).
    Also not for validating a graph without needing the round-trip text — a
    plain isNodeType/isEdgeType check (src/ir/types.ts) is cheaper.
  natural_language_examples:
    - "parse this Mermaid-like flowchart into the graph model"
    - "convert my flowchart DSL string into nodes and edges"
    - "why did my flowchart text fail to parse"
    - "turn this flow graph back into DSL text"
    - "serialize this diagram so I can save or display it as text"
  confirm_before: "none — read-only, in-memory compile step; no I/O, no destructive action"
  summarize_after_success: >
    "Parsed N nodes / M edges, direction <dir>" (parse) or
    "Serialized to an L-line DSL text block" (serialize)
  summarize_after_failure: "the FlowchartParseError's `line:column: reason` verbatim — never paraphrased"

cross_cutting:
  wcag: "n/a — no UI/DOM output; a pure text↔IR compiler consumed by layers that DO render (not this one)"
  auth: "n/a — no DB, no principal, no permission surface; a pure function over its own arguments"
  mobile: "n/a — no UI rendering; not a viewport-facing surface"
  i18n: >
    n/a — FlowchartParseError.reason strings are developer-facing DSL diagnostics
    (for the person authoring the DSL text to debug their own input), not
    end-user UI copy; they are not routed through an i18n layer.

authorization:
  layer_a_brand: "n/a — no DB/authorization surface (pure parser/serializer, no principal, no repository)"
  rls_directive: "n/a — no schema/table backs this feature"
  policies: []
  permission_slugs_used: []
  rls_deny_test: "n/a — no DB layer to test against"

links:
  flows:
    - src/parse/__specs__/flows/parse-flowchart.flow.yaml
    - src/parse/__specs__/flows/serialize-flowchart.flow.yaml
  tests:
    # NOTE (spec-writer finding, not a scope call): TEST_NAMING#unit_layout requires
    # <feature>/__tests__/<code>.test.ts; the actual file backing this feature lives
    # at src/parse/parseFlowchart.test.ts (feature root, no __tests__/ folder). This
    # spec links to the file that ACTUALLY exists (backfill reflects reality); the
    # location deviation is flagged in standards-compliance.yaml (TEST_NAMING) and
    # must be resolved (file relocated to __tests__/) before verifier Mode A can
    # legitimately stamp this feature locked.
    - src/parse/parseFlowchart.test.ts
  manual:
    - src/parse/__specs__/manual/parse-flowchart.md
    - src/parse/__specs__/manual/serialize-flowchart.md
