flow: serializeFlowchart
kind: helper
source: src/parse/serializeFlowchart.ts
symbol: serializeFlowchart

inputs:
  graph: "iFlowGraph — { id, name, direction, nodes: iFlowNode[], edges: iFlowEdge[] } (src/ir/types.ts)"

returns:
  - "string — DSL text: a 'flowchart <DIR>' header line, then one indented '<id><open><label><close>:::<type>' line per node, then one indented '<from> <glyph>[|label|]:::<type> <to>' line per edge, newline-joined"

throws: []

calls:
  - "serializeNode (private)"

called_by:
  - "consumer code doing IR→text (display, export, save, editor round-trip)"
  - "parseFlowchart round-trip tests (parse → serialize → parse stability)"

emits_events: []

side_effects_on_success:
  - "none"

side_effects_on_failure: "none — see edge_boundary_invalid_node_type / edge_boundary_invalid_edge_type below for the one case where this function does NOT fail gracefully"

transaction: "none"

test: src/parse/parseFlowchart.test.ts
spec: src/parse/__specs__/spec.yaml

ai_agent_action:
  when_to_call: "an agent/consumer holds an iFlowGraph and needs DSL text (to display, save, export, or hand to a human/another tool that reads the DSL)"
  when_not_to_call: "the caller needs text→IR (use parseFlowchart instead); the caller needs the graph rendered visually (this returns text, not React nodes)"
  natural_language_examples:
    - "turn this flow graph back into DSL text"
    - "serialize this diagram so I can save it"
    - "show me the Mermaid-like text for this graph"
  agent_invocation: "library import — `import { serializeFlowchart } from '@yantrakit/flowchart-react'`; direct function call, not callable over HTTP/CLI/UI"
  confirm_with_user_before: "none — read-only, in-memory render step"
  summarize_to_user_after: "\"Serialized to an L-line DSL text block\""

paths:
  happy:
    - "emit line 0: 'flowchart <graph.direction>'"
    - "for each graph.nodes[i] in array order: emit '  ' + serializeNode(node) = '<id><SHAPE[type].open><label><SHAPE[type].close>:::<type>'"
    - "for each graph.edges[i] in array order: emit '  <from> <GLYPH[type]>[|label|]:::<type> <to>' (the |label| segment present only when edge.label is truthy)"
    - "join all lines with '\\n' and return"

  edge_boundary_edge_label_present:
    - "edge.label is a non-empty string — the emitted edge line includes '|<label>|' between the glyph and the ':::<type>' class marker"

  edge_boundary_edge_label_absent:
    - "edge.label is undefined (or empty-string, which is falsy) — the '|...|' segment is omitted entirely; the line reads '<from> <glyph>:::<type> <to>' with no double-space artifact"

  edge_boundary_empty_graph:
    - "graph.nodes and graph.edges are both empty arrays — both for-loops execute zero iterations; the function returns just the single header line 'flowchart <DIR>' with no error"

  edge_boundary_round_trip_drops_data:
    - "graph contains a node with a populated `data` field (iFlowNode.data, arbitrary consumer payload) — serializeNode only reads id/label/type; `data` is never referenced anywhere in this function and is silently absent from the output text (documented in this file's header comment, not an error)"

  edge_boundary_round_trip_stable_for_all_shapes_and_glyphs:
    - "parseFlowchart(serializeFlowchart(g)) reproduces g's direction/nodes/edges (ids/labels/types) for every documented node type (start/end/decision/action/error/warning) and every documented edge type (default/warning/error/happy), because every node/edge is emitted with an explicit ':::type' class that parseFlowchart's explicit-class resolution honors over shape/position"

  edge_boundary_invalid_node_type:
    - "KNOWN-NOT-VALIDATED: a caller bypasses TypeScript (an `as iFlowGraph` cast, or a graph deserialized from untrusted JSON against schema/flow-graph.schema.json without runtime validation) and supplies a node.type value outside the 7-member iNodeType enum — SHAPE[node.type] is undefined, and the destructure `const [open, close] = SHAPE[node.type]` throws a raw, untyped TypeError (NOT a FlowchartParseError). Slim probability because every documented construction path (parseFlowchart's resolveNodeTypes, or hand-authoring against the exported iFlowNode type) only ever produces a legal iNodeType — the only route to this path is deliberately defeating the type system. Acceptable to leave unvalidated because this function has no declared throws contract to keep (serialize is documented as never throwing on a well-typed input) and adding runtime validation is a source change out of this spec-writer pass's scope; surfaced to the human/verifier as a real gap, not silently patched."

  edge_boundary_invalid_edge_type:
    - "KNOWN-NOT-VALIDATED: same shape as edge_boundary_invalid_node_type but for GLYPH[edge.type] on an edge.type outside the 4-member iEdgeType enum — same slim probability (type-system bypass only), same acceptance rationale, same surfaced-not-patched disposition."

mermaid: |
  flowchart TD
    start([serializeFlowchart]) --> hdr[Emit 'flowchart DIR' header line]
    hdr --> nodeLoop{Any nodes left?}
    nodeLoop -->|yes| shapeLookup{node.type is a legal iNodeType?}
    shapeLookup -->|yes, well-typed path| emitNode[Emit '  id shape:::type']:::action
    shapeLookup -->|no, type-system bypass| errNode[edge_boundary_invalid_node_type: raw TypeError]:::error
    emitNode --> nodeLoop
    nodeLoop -->|no| edgeLoop{Any edges left?}
    edgeLoop -->|yes| glyphLookup{edge.type is a legal iEdgeType?}
    glyphLookup -->|yes, well-typed path| emitEdge[Emit '  from glyph|label|:::type to']:::action
    glyphLookup -->|no, type-system bypass| errEdge[edge_boundary_invalid_edge_type: raw TypeError]:::error
    emitEdge --> edgeLoop
    edgeLoop -->|no| join[Join lines with newline]
    join --> done([DSL text string])
