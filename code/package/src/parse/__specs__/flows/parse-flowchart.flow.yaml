flow: parseFlowchart
kind: helper
source: src/parse/parseFlowchart.ts
symbol: parseFlowchart

inputs:
  text: "string — the Mermaid-like flowchart DSL source"
  options: "iParseOptions (optional, default {}) — { direction?: iDirection, id?: string, name?: string }"

returns:
  - "iFlowGraph — { id, name, direction, nodes: iFlowNode[], edges: iFlowEdge[] } (src/ir/types.ts)"

throws:
  - "FlowchartParseError — malformed input; never a partial graph (see errors.ts)"

calls:
  - "stripComment (private)"
  - "tryParseHeader (private)"
  - "normalizeDirection (private)"
  - "parseStatement (private)"
  - "consumeNodeToken (private)"
  - "consumeLink (private)"
  - "upsertNode (private)"
  - "resolveNodeTypes (private)"
  - "isNodeType (../ir/types)"
  - "isEdgeType (../ir/types)"

called_by:
  - "consumer code that has DSL text and needs the IR (pre-render, pre-layout, pre-path-analysis)"
  - "serializeFlowchart round-trip tests"

emits_events: []

side_effects_on_success:
  - "none"

side_effects_on_failure: "none"

transaction: "none"

test: src/parse/parseFlowchart.test.ts
spec: src/parse/__specs__/spec.yaml

ai_agent_action:
  when_to_call: "an agent/consumer has Mermaid-like flowchart DSL text and needs the typed iFlowGraph IR"
  when_not_to_call: "the caller already has an iFlowGraph (skip parsing) OR needs IR→text (use serializeFlowchart instead)"
  natural_language_examples:
    - "parse this flowchart DSL into a graph"
    - "why does my Mermaid-like diagram fail to load"
    - "convert this flowchart string to nodes and edges"
  agent_invocation: "library import — `import { parseFlowchart } from '@yantrakit/flowchart-react'`; direct function call, not callable over HTTP/CLI/UI"
  confirm_with_user_before: "none — read-only, in-memory compile step"
  summarize_to_user_after: "\"Parsed N nodes / M edges, direction <dir>\" on success; the FlowchartParseError `line:column: reason` verbatim on failure"

paths:
  happy:
    - "split text into lines; find the first non-blank/non-comment line"
    - "match it against `/^(?:flowchart|graph)\\s+([A-Za-z]+)\\s*$/`; normalize TB→TD, uppercase, validate ∈ {TD,BT,LR,RL}"
    - "for each remaining content line: parse a lone node token or an edge chain (id (link id)+), accumulating nodes (Map, later-wins on redeclare) and edges (array, synthesized id `e<n>`)"
    - "after the loop: run the 2-pass resolver — pass 1 assigns type from explicit class / shape (decision→decision, else action; stadium left unresolved); pass 2 resolves stadium by position (no-incoming→start, no-outgoing→end, else action); if no node is `start`, promote entry-with-no-incoming action node(s) (or the first node); if no node is `end`, promote exit-with-no-outgoing action node(s)"
    - "return { id: options.id ?? 'flowchart', name: options.name ?? 'flowchart', direction, nodes: resolved, edges }"

  error_missing_header:
    - "first non-blank/non-comment line does not match the header regex AND options.direction was not supplied"
    - "throw FlowchartParseError('expected header \"flowchart <TD|BT|LR|RL>\" as the first line, got \"<line>\"', lineNo) — terminal: the DSL author sees the exact offending line + its line number and adds the required header; no alternative flow, explanation suffices"

  error_unknown_direction:
    - "the header line DOES match `flowchart|graph <TOKEN>` but TOKEN (uppercased) is not TD/BT/LR/RL after the TB→TD normalization"
    - "throw FlowchartParseError('unknown direction \"<token>\" (expected TD, TB, BT, LR or RL)', lineNo) — terminal: explanation names the exact bad token"

  error_missing_direction:
    - "input contains ONLY blank lines and/or %% comments (no content line is ever reached) AND options.direction was not supplied — headerSeen never flips true, direction stays undefined through the whole loop"
    - "after the loop: throw FlowchartParseError('missing flow direction (no header, no options.direction)', 1) — terminal: explanation names the exact cause"

  error_empty_diagram:
    - "direction resolves (header or options.direction) but zero node statements are ever parsed (e.g. text is only the header line)"
    - "throw FlowchartParseError('diagram has no nodes', 1) — terminal: explanation is unambiguous"

  error_expected_node_id:
    - "a statement's first (or post-link) token does not start with `/^[A-Za-z0-9_]+/` (e.g. a line starting with the link glyph itself, or garbage)"
    - "throw FlowchartParseError('expected a node id, got \"<first 12 chars>\"', lineNo, col) — terminal"

  error_unclosed_shape_bracket:
    - "a node token opens `[`, `{`, or `([` and the matching close (`]`, `}`, `])`) is never found on the line"
    - "throw FlowchartParseError('unclosed \"[\" / \"{\" / \"([\" for node \"<id>\"', lineNo, col) — one throw site per bracket kind, same shape; terminal, names the offending node id"

  error_malformed_node_class:
    - "a node token has `:::` immediately followed by something that is not `/^:::([A-Za-z]+)/` (e.g. `:::` with no name, or immediately followed by whitespace/end-of-token)"
    - "throw FlowchartParseError('malformed class on node \"<id>\"', lineNo, col) — terminal"

  error_unknown_node_class:
    - "a node token's `:::NAME` matches the class regex but NAME fails `isNodeType` (not one of start/end/action/decision/error/warning/link)"
    - "throw FlowchartParseError('unknown node class \":::<cls>\" on node \"<id>\"', lineNo, col) — terminal"

  error_expected_edge_glyph:
    - "after a node token, remaining text on the line is non-empty but does not start with any of `-->`, `-.->`, `==>`"
    - "throw FlowchartParseError('expected an edge (\"-->\", \"-.->\" or \"==>\"), got \"<first 8 chars>\"', lineNo, col) — terminal"

  error_unclosed_edge_label:
    - "a link's remaining text starts with `|` but a second `|` is never found on the line"
    - "throw FlowchartParseError('unclosed edge label \"|\"', lineNo, col) — terminal"

  error_malformed_edge_class:
    - "after a link (+ optional label), remaining text starts with `:::` but does not match `/^:::([A-Za-z]+)/`"
    - "throw FlowchartParseError('malformed edge class', lineNo, col) — terminal"

  error_unknown_edge_class:
    - "a link's `:::NAME` matches the class regex but NAME fails `isEdgeType` (not one of happy/warning/error/default)"
    - "throw FlowchartParseError('unknown edge class \":::<cls>\"', lineNo, col) — terminal"

  edge_boundary_comments_and_blank_lines:
    - "a full-line `%%` comment, a trailing `%%` comment on a content line, and blank lines are all stripped/skipped before any tokenization runs — they contribute zero nodes/edges and never affect line numbering for later errors"

  edge_boundary_direction_normalization_and_case:
    - "header token is matched case-sensitively for the keyword (`flowchart`/`graph`) but the direction token is uppercased before comparison (`tb`/`Tb`/`TB` all normalize to `TD`); `graph` is accepted as a header keyword synonym for `flowchart`"

  edge_boundary_options_direction_without_header:
    - "options.direction is supplied and the FIRST line is NOT a valid header — headerSeen is forced true without consuming that line as a header, and it is parsed as an ordinary content line (node/edge) instead; no header line is required anywhere in the text"

  edge_boundary_node_redeclaration_upgrades:
    - "a bare node id (`b`) is later re-mentioned with a shape and/or explicit class (`b[Labeled]` or `b:::error`) — `upsertNode` merges: label/shape from the LATEST mention always win; an explicit class from ANY mention (not necessarily the latest) locks `explicit=true` and the resolved type permanently, overriding later shape-only mentions"

  edge_boundary_start_end_by_position:
    - "a `([Label])` stadium node with zero incoming edges resolves to `start`; one with zero outgoing edges resolves to `end`; one with BOTH incoming and outgoing edges resolves to plain `action` (not start/end)"

  edge_boundary_cycle_fallback_first_node:
    - "no node in the diagram naturally resolves to `start` (e.g. every node is in a two-node cycle a→b→a) — the first non-explicit action node with no incoming edge is promoted; if even that set is empty, the very first parsed node is force-promoted to `start` UNLESS it already carries an explicit `:::class` (an explicitly-classed first node in a cycle is left as its explicit type and the graph legitimately ends up with no `start` node at all)"

  edge_boundary_chain_multi_hop:
    - "a single statement `A --> B --> C` parses as TWO edges (A→B, B→C) sharing no glyph re-parsing between hops; each hop's own link/label/class is independently resolved"

  edge_boundary_tight_tokenization_no_spaces:
    - "`a-->b` (no surrounding whitespace) tokenizes as id=`a`, link=`-->`, id=`b` — the ID regex excludes `-` specifically so the id does not swallow the glyph's leading dashes"

mermaid: |
  flowchart TD
    start([parseFlowchart]) --> split[Split into lines]
    split --> hdr{First content line is a valid header or options.direction set?}
    hdr -->|no, no options.direction| errHeader[error_missing_header]:::error
    hdr -->|yes| dir{Direction token valid TD/BT/LR/RL after TB→TD?}
    dir -->|no| errDir[error_unknown_direction]:::error
    dir -->|yes| loop[Parse each remaining line: node token or edge chain]
    loop --> tok{Token well-formed?}
    tok -->|bad id| errId[error_expected_node_id]:::error
    tok -->|unclosed bracket| errBracket[error_unclosed_shape_bracket]:::error
    tok -->|bad node class| errNodeClass[error_unknown_node_class / error_malformed_node_class]:::error
    tok -->|missing glyph| errGlyph[error_expected_edge_glyph]:::error
    tok -->|unclosed label| errLabel[error_unclosed_edge_label]:::error
    tok -->|bad edge class| errEdgeClass[error_unknown_edge_class / error_malformed_edge_class]:::error
    tok -->|ok| accum[Accumulate node/edge]
    accum --> loop
    loop --> noContent{Direction never resolved?}
    noContent -->|yes| errNoDir[error_missing_direction]:::error
    noContent -->|no, but zero nodes| errEmpty[error_empty_diagram]:::error
    noContent -->|no, nodes exist| resolve[resolveNodeTypes: 2-pass class/shape then position]
    resolve --> done([iFlowGraph])
