flow: isEdgeType
kind: predicate
source: src/ir/types.ts
symbol: isEdgeType

inputs:
  value: "unknown — any value to narrow, typically a string extracted from a parsed Mermaid edge-style token or an external JSON payload"

returns:
  - "true — value is a string AND a member of EDGE_TYPES (narrows value to iEdgeType)"
  - "false — value is not a string, OR is a string not present in EDGE_TYPES"

throws: []
calls:
  - "EDGE_TYPES (module-level constant array) via Array.prototype.includes"
called_by:
  - src/parse/parseFlowchart.ts
emits_events: []

side_effects_on_success:
  - "none"
side_effects_on_failure: "none"
transaction: "none"

test: src/ir/types.test.ts
spec: src/ir/__specs__/spec.yaml

ai_agent_action:
  when_to_call: "Before trusting an untyped string as an iEdgeType — e.g. parseFlowchart narrowing a parsed Mermaid edge style/class token to an edge's semantic kind."
  when_not_to_call: "When the value's type is already statically known to be iEdgeType (redundant); when checking anything other than a single scalar edge-type value."
  natural_language_examples:
    - "is 'happy' a valid edge type?"
    - "check whether this parsed edge style is a legal edge kind"
  agent_invocation: "internal — not callable over HTTP/UI; import isEdgeType from '@yantrakit/flowchart-react' (or 'src/ir' inside this repo) and call it directly"
  confirm_with_user_before: "none — read-only, pure, no side effects"
  summarize_to_user_after: "'{value}' is / is not a legal edge type."

paths:
  happy:
    - step: "Caller passes each of the 4 EDGE_TYPES members ('happy', 'warning', 'error', 'default')."
    - step: "typeof value === 'string' evaluates true for each."
    - step: "EDGE_TYPES.includes(value) evaluates true for each."
    - step: "Function returns true, narrowing value to iEdgeType."
  edge_boundary_unrecognized_string:
    - step: "Caller passes a plausible-looking but illegal string (e.g. 'dotted' — a line-style word that isn't in EDGE_TYPES)."
    - step: "typeof value === 'string' evaluates true."
    - step: "EDGE_TYPES.includes(value) evaluates false."
    - step: "Function returns false — no throw, no partial match, no case-folding, no closest-match guess."
  edge_boundary_non_string_input:
    - step: "Caller passes a non-string value (e.g. null)."
    - step: "typeof value === 'string' short-circuits to false before .includes() runs."
    - step: "Function returns false uniformly for every non-string input, regardless of shape."

mermaid: |
  flowchart TD
    A[isEdgeType value] --> B{typeof value equals string}
    B -- no --> F[return false]
    B -- yes --> C{EDGE_TYPES includes value}
    C -- no --> F
    C -- yes --> T[return true]
