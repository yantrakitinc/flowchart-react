feature_name: paths

scope_authority: user

ui_design: not-applicable

operation:
  name: Detect semantic paths
  slug: "(internal)"
  description: Enumerate every start→end route in a flow graph and classify each by its dominant edge semantics (happy / warning / error / neutral).

invocation:
  type: internal

chat_agent:
  when_to_call: >-
    The caller already holds a parsed/authored iFlowGraph (e.g. output of parseFlowchart, or a
    hand-built graph object) and needs the enumerated, semantically-classified routes through it —
    to render a path list, highlight the happy path, count/flag error routes, or drive PathDrawer/usePaths.
  when_not_to_call: >-
    Before the graph is fully built (parse/author it first; detectPaths does not parse Mermaid text
    itself). Not for repeated per-keystroke calls on a large, highly-branching graph without memoizing
    the result (the DFS cost is bounded by MAX_PATHS/MAX_DEPTH but is not free).
  natural_language_examples:
    - "show me the happy path through this flowchart"
    - "which routes lead to an error state"
    - "highlight all paths in this diagram"
    - "how many distinct paths exist and which are risky"
  confirm_before: "none — read-only, pure computation, no side effects, safe to call unconditionally"
  summarize_after_success: >-
    "Found {paths.length} path(s): {n} happy, {n} warning, {n} error, {n} neutral."
  summarize_after_failure: >-
    "n/a — detectPaths never throws and never returns a non-ok shape; there is no failure branch to summarize."

cross_cutting:
  wcag: "n/a — pure data computation; renders no UI itself (consuming UI components declare their own WCAG posture)"
  auth: "n/a — internal library function; no DB access, no principal, no permission check"
  mobile: "n/a — no UI surface; consuming UI components declare their own mobile behavior"
  i18n: "n/a — returns structural node/edge ids and the closed iPathType enum only; no user-facing strings originate here"

links:
  flows:
    - src/paths/__specs__/flows/detect-paths.flow.yaml
  tests:
    - src/paths/detectPaths.test.ts
  manual:
    - src/paths/__specs__/manual/detect-paths.md
