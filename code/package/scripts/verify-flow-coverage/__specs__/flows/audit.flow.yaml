flow: audit
kind: service-method
source: scripts/verify-flow-coverage/verify-flow-coverage.mjs
symbol: audit
inputs:
  srcDir: absolute path to walk
  injected: optional IO injection (listFiles / listExportedBehaviors / existsSync / readFile)
returns:
  - "{ exportedCount, missing: Array<{ flowsDir, behavior, sourceFile, candidates }> }"
throws: []
calls:
  - listAllFiles (default)
  - listExportedBehaviors (default)
  - existsSync (default)
  - isInScope
  - flowDocCandidates
called_by:
  - main
emits_events: []
side_effects_on_success: ["none"]
side_effects_on_failure: "none"
transaction: none
test: scripts/verify-flow-coverage/__tests__/verify-flow-coverage.test.mjs
spec: scripts/verify-flow-coverage/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "internal — only main composes audit"
  when_not_to_call: "external callers"
  natural_language_examples: []
  agent_invocation: "internal — not callable"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "n/a — internal helper"
paths:
  happy:
    - walk srcDir; for each in-scope file, list its exported behaviors
    - for each behavior, check whether any candidate flow doc exists
    - accumulate missing entries; return { exportedCount, missing }
  edge_no_exports:
    - file has no exported behaviors → counted as zero, no missing entry
  edge_all_covered:
    - every behavior has a matching candidate → return { exportedCount, missing: [] }
  edge_legacy_md_present:
    - candidate '.flow.md' exists, '.flow.yaml' does not → behavior considered covered
  edge_new_yaml_present:
    - candidate '.flow.yaml' exists, '.flow.md' does not → behavior considered covered
  edge_both_present:
    - both '.flow.yaml' and '.flow.md' exist → behavior considered covered (first hit wins)
