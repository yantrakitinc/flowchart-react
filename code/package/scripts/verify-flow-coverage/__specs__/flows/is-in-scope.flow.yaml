flow: isInScope
kind: predicate
source: scripts/verify-flow-coverage/verify-flow-coverage.mjs
symbol: isInScope
inputs:
  filePath: absolute path under src/
  injected: optional { readFile } injection
returns:
  - "true when the file must be checked"
  - "false otherwise"
throws: []
calls:
  - readFile (default)
called_by:
  - audit
emits_events: []
side_effects_on_success: ["none"]
side_effects_on_failure: "none"
transaction: none
test: scripts/verify-flow-coverage/__tests__/verify-flow-coverage.test.mjs
spec: scripts/verify-flow-coverage/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "internal — only audit calls this"
  when_not_to_call: "external callers"
  natural_language_examples: []
  agent_invocation: "internal — not callable"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "n/a — internal helper"
paths:
  happy:
    - filePath is a normal behavior file (e.g. client.ts) → return true
  edge_index_or_types:
    - basename is 'index.ts' or 'types.ts' → return false
  edge_test_file:
    - filename ends in '.test.ts' or '.test.tsx' → return false
  edge_config_file:
    - filename ends in '.config.ts' → return false
  edge_tests_or_specs_folder:
    - path contains '/__tests__/' or '/__specs__/' → return false
  edge_backup_folder:
    - path contains '/__specs__.backup/' → return false
  edge_dts:
    - filename ends in '.d.ts' → return false
  edge_non_ts:
    - filename doesn't end in '.ts' or '.tsx' → return false
  edge_setup_file_marker:
    - first ~2KB of file contains 'SETUP FILE.' → return false
