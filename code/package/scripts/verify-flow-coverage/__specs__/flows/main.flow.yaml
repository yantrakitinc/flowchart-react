flow: main
kind: composition-root
source: scripts/verify-flow-coverage/verify-flow-coverage.mjs
symbol: main
inputs:
  io: optional IO injection (srcDir / rootDir / listFiles / listExportedBehaviors / existsSync / readFile / write / writeErr)
returns:
  - "{ exitCode: 0 }"
  - "{ exitCode: 1 }"
throws: []
calls:
  - audit
  - formatReport
called_by:
  - cliMain
  - scripts/verify-mode-compliance.mjs
  - pnpm verify
emits_events: []
side_effects_on_success:
  - "stdout: 'verify-flow-coverage: OK (<N> exported behavior(s) checked)'"
side_effects_on_failure: "stderr emits summary + one MISSING line per uncovered behavior; process exits 1"
transaction: none
test: scripts/verify-flow-coverage/__tests__/verify-flow-coverage.test.mjs
spec: scripts/verify-flow-coverage/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "Whenever the user asks 'are all exports covered by flow docs?' or as part of pnpm verify."
  when_not_to_call: "During mid-feature work where new exports legitimately have no flow doc yet."
  natural_language_examples:
    - "verify flow coverage"
    - "missing flow docs?"
  agent_invocation: "internal — invoked by scripts/verify-mode-compliance.mjs"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "Quote stdout/stderr verbatim; on failure list each MISSING."
paths:
  happy:
    - audit walks src/ and finds zero uncovered behaviors
    - formatReport produces the OK stdout line
    - main returns exitCode 0
  error_missing_flow_doc:
    - audit returns one or more missing entries
    - formatReport produces summary + one MISSING line per entry
    - main returns exitCode 1
