flow: verify-flow-coverage
start: "shell at <repo>/code/web"
preconditions:
  - "pnpm install has run"
  - "working tree is in the state to be verified"
steps:
  - action: "Invoke the script directly"
    selector: ""
    input: "node scripts/verify-flow-coverage/verify-flow-coverage.mjs"
    expected: "either an OK line on stdout (exit 0) or a MISSING block on stderr (exit 1)"
    assertion: "stdout contains 'verify-flow-coverage: OK' OR stderr contains 'verify-flow-coverage:' with exit code 1"
  - action: "Pick a feature folder that uses the NEW shape (e.g. src/db/client)"
    selector: ""
    input: "ls src/db/client/__specs__/flows"
    expected: "you see one or more *.flow.yaml files"
    assertion: "ls output contains '.flow.yaml' filenames"
  - action: "Temporarily rename the new-shape doc to confirm the dual-shape policy"
    selector: ""
    input: "mv src/db/client/__specs__/flows/get-db.flow.yaml /tmp/get-db.flow.yaml.bak"
    expected: "the new doc is moved aside; legacy '.flow.md' is also absent → behavior is now uncovered"
    assertion: "no get-db.flow.md AND no get-db.flow.yaml exist under src/db/client/__specs__/flows/"
  - action: "Re-run the script"
    selector: ""
    input: "node scripts/verify-flow-coverage/verify-flow-coverage.mjs"
    expected: "exit 1 and a MISSING line naming get-db"
    assertion: "exit code is 1 AND stderr contains 'MISSING' AND 'get-db'"
  - action: "Restore by placing a .flow.md (legacy shape) — the dual-shape policy should accept it"
    selector: ""
    input: "echo '## Paths\\nnone\\n' > src/db/client/__specs__/flows/get-db.flow.md"
    expected: "legacy form satisfies the coverage check"
    assertion: "file exists"
  - action: "Re-run the script"
    selector: ""
    input: "node scripts/verify-flow-coverage/verify-flow-coverage.mjs"
    expected: "exit 0 — legacy '.flow.md' counts as covered"
    assertion: "exit code is 0 AND stdout contains 'verify-flow-coverage: OK'"
  - action: "Clean up"
    selector: ""
    input: "rm src/db/client/__specs__/flows/get-db.flow.md && mv /tmp/get-db.flow.yaml.bak src/db/client/__specs__/flows/get-db.flow.yaml"
    expected: "the working tree returns to its starting state"
    assertion: "git status shows no leftover changes"
assertions:
  - "Exit code 0 when every exported behavior has at least one matching flow doc (yaml OR md)"
  - "Exit code 1 when at least one export has neither candidate"
  - "Dual-shape policy: yaml-only and md-only and both-present all satisfy the gate"
failure_capture:
  - "stderr → /tmp/verify-flow-coverage.stderr.txt for triage"
