feature_name: scripts-verify-flow-coverage
version: 1
operation:
  name: Verify flow-doc coverage
  slug: "(internal)"
  description: Walks src/ and asserts every exported behavior function has a co-located __specs__/flows/<kebab-name>.flow.md OR .flow.yaml file.
invocation:
  type: internal
  method: ""
  path: ""
chat_agent:
  when_to_call: User asks "is every exported function covered by a flow doc?" or as part of pnpm verify.
  when_not_to_call: During mid-feature work — newly added exports legitimately have no flow doc yet.
  natural_language_examples:
    - "verify flow coverage"
    - "every export has a flow doc?"
    - "any missing flow.yaml or flow.md?"
  confirm_before: "none — read-only"
  summarize_after_success: "verify-flow-coverage: OK (<N> exported behavior(s) checked)"
  summarize_after_failure: "verify-flow-coverage: <N> missing flow doc(s) — <list>"
cross_cutting:
  wcag: "n/a — CLI script"
  auth: "none — filesystem-only"
  mobile: "n/a — CLI script"
  i18n: "none — script output is English-only operator log"
links:
  flows:
    - flows/main.flow.yaml
    - flows/audit.flow.yaml
    - flows/is-in-scope.flow.yaml
    - flows/flow-doc-candidates.flow.yaml
  tests:
    - __tests__/verify-flow-coverage.test.mjs
  manual:
    - manual/verify-flow-coverage.yaml
