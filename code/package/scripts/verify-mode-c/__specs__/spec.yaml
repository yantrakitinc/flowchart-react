feature_name: scripts-verify-mode-c
version: 1
operation:
  name: Verifier Mode C — push-time slice re-verify
  slug: "(internal)"
  description: For each unique slice touched by the current diff against origin/master, invokes Mode A end-to-end. Aggregates verdicts. Opt-in at the final-push prompt for tricky / security-sensitive features.
invocation:
  type: internal
  method: ""
  path: ""
chat_agent:
  when_to_call: final-push prompt — developer chose "re-verify every slice in this push"
  when_not_to_call: per-slice during development (use Mode A) OR routine push (use Mode B) OR full repo (use Mode D)
  natural_language_examples:
    - "run mode C"
    - "re-verify every slice in this push"
  confirm_before: "none — read-only except per-slice lock stamps"
  summarize_after_success: "Mode C: all slices PASS"
  summarize_after_failure: "Mode C: <n>/<total> slices FAIL"
cross_cutting:
  wcag: "n/a — CLI"
  auth: "filesystem + git only"
  mobile: "n/a — CLI"
  i18n: "operator-log English-only"
links:
  flows:
    - flows/main.flow.yaml
  tests:
    - __tests__/verify-mode-c.test.mjs
