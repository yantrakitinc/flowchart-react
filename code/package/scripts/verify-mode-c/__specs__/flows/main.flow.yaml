flow: main
kind: helper
source: verify-mode-c.mjs
symbol: main
inputs:
  io: optional IO ports — spawn / execPath / rootDir / getChanged / modeAPath / write / writeErr
returns:
  - "{ exitCode: 0 | 1, slices: string[], perSliceStatus: Array<{ slice, status }> }"
throws: []
calls:
  - getChangedPaths (scripts/lib/changed-paths.mjs)
  - findSliceRoot
  - slicesFromChangedPaths
  - "scripts/verify-mode-a/verify-mode-a.mjs (via spawn, one invocation per slice)"
called_by:
  - cliMain
  - test suite
emits_events: []
side_effects_on_success: [Mode A may stamp per-slice locks on green]
side_effects_on_failure: ["none beyond Mode A's own side-effect rules"]
transaction: none
test: __tests__/verify-mode-c.test.mjs
spec: ../spec.yaml
ai_agent_action:
  when_to_call: final-push prompt — developer chose "re-verify every slice"
  when_not_to_call: per-slice (Mode A), routine push (Mode B), full repo (Mode D)
  natural_language_examples:
    - "run mode C"
  agent_invocation: "internal — `node scripts/verify-mode-c/verify-mode-c.mjs`"
  confirm_with_user_before: "none — read-only except per-slice lock stamps via Mode A"
  summarize_to_user_after: "aggregate verdict + per-slice breakdown"
paths:
  happy:
    - compute changed paths via getChangedPaths(origin/master)
    - resolve each to its slice root (nearest ancestor with __specs__/standards-compliance.yaml)
    - invoke Mode A for each unique slice
    - aggregate; exit 0 iff all slices PASS
  edge_no_changes:
    - getChanged returns empty; print "nothing to verify" + exit 0
  edge_no_slices:
    - changed paths don't resolve to any spec'd folder (e.g. only top-level config changed); print + exit 0
  error_slice_fails:
    - any Mode A invocation returns non-zero; aggregate exit 1 with per-slice breakdown
