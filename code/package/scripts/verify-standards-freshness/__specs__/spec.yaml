feature_name: scripts-verify-standards-freshness
version: 1
operation:
  name: Verify standards-compliance lock-file freshness vs git history
  slug: "(internal)"
  description: For every __specs__/standards-compliance.yaml, asks git for the most recent commit touching the feature folder (excluding the lock itself) and compares that date to the lock's last_validated. Stale = commit date is more than 5min newer than last_validated. The slow / thorough complement to verify-standards-compliance (which only checks YAML shape).
invocation:
  type: internal
  method: ""
  path: ""
chat_agent:
  when_to_call: User asks "is anything stale?" / "have we forgotten to re-stamp anything?" / before merging a long-lived feature branch. Also invoked automatically by `pnpm verify:full` (CI gate).
  when_not_to_call: During fast local iteration — runs N `git log` invocations (one per lock file) and is slower than verify-standards-compliance. For the fast presence check, use that script instead.
  natural_language_examples:
    - "verify standards freshness"
    - "anything stale relative to git?"
    - "run the thorough standards gate"
  confirm_before: "none — read-only"
  summarize_after_success: "verify-standards-freshness: OK — <N> lock file(s) fresh vs git history"
  summarize_after_failure: "verify-standards-freshness: <N> lock file(s) stale — <list>"
cross_cutting:
  wcag: "n/a — CLI script"
  auth: "none — filesystem + local git only"
  mobile: "n/a — CLI script"
  i18n: "none — operator-log output is English-only"
links:
  flows:
    - flows/verify-standards-freshness.flow.yaml
  tests:
    - __tests__/verify-standards-freshness.test.mjs
