feature_name: scripts-verify-mode-cleanup-orphans
version: 1
operation:
  name: Verifier Mode Cleanup-Orphans — detect orphan locks + catalog mismatches
  slug: "(internal)"
  description: Scans every lock; reports (a) orphan locks where the slice folder has no source files siblings to `__specs__/`, and (b) catalog mismatches where a spec.yaml's `feature_name` does not match the slice's relative path. Report-only — does not modify the working tree.
invocation:
  type: internal
  method: ""
  path: ""
chat_agent:
  when_to_call: hygiene audit (e.g., after refactors that deleted source but left specs)
  when_not_to_call: stamp validation (B / B.5 / D / F / F-Random) or stamp update (A / C / E)
  natural_language_examples:
    - "mode cleanup orphans"
    - "find stale lock files"
  confirm_before: "none — report-only"
  summarize_after_success: "Mode Cleanup-Orphans: <N> orphan(s); <M> catalog mismatch(es)"
  summarize_after_failure: "n/a — Mode Cleanup-Orphans always exits 0"
cross_cutting:
  wcag: "n/a — CLI"
  auth: "filesystem only"
  mobile: "n/a — CLI"
  i18n: "operator-log English-only"
links:
  flows:
    - flows/main.flow.yaml
