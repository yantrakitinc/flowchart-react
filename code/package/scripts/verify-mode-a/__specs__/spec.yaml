feature_name: scripts-verify-mode-a
version: 1
operation:
  name: Verifier Mode A — slice-on-commit
  slug: "(internal)"
  description: Targeted verification of a single slice. Runs scoped vitest, scoped eslint, project-wide typecheck, PRIMARY RULE grep boundary checks, and a lock-shape check. On all-green, stamps the slice's standards-compliance.yaml. Exit 0 on SHIPPABLE; 1 otherwise.
invocation:
  type: internal
  method: ""
  path: ""
chat_agent:
  when_to_call: "Coder hands off the slice; verifier needs to confirm SHIPPABLE before the lock is stamped."
  when_not_to_call: "Push-time verification (use Mode B) or end-to-end (Mode D)."
  natural_language_examples:
    - "verify the slice"
    - "run mode A on src/features/foo"
  confirm_before: "none — read-only except for the lock stamp on green"
  summarize_after_success: "Mode A: SHIPPABLE — lock stamped at <iso>"
  summarize_after_failure: "Mode A: NOT SHIPPABLE — <first failing gate>"
cross_cutting:
  wcag: "n/a — CLI"
  auth: "filesystem only"
  mobile: "n/a — CLI"
  i18n: "operator-log English-only"
links:
  flows:
    - flows/main.flow.yaml
  tests:
    - __tests__/verify-mode-a.test.mjs
