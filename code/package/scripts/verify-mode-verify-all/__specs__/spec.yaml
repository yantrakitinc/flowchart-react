feature_name: scripts-verify-mode-verify-all
version: 1
operation:
  name: Verifier Mode Verify-All — feature-by-feature deep ceremony
  slug: "(internal)"
  description: Feature-by-feature deep proof. For each slice in the repo, unlocks the lock, runs Mode Pristine+Compliance, on pass invokes Mode A to relock with fresh stamp. Per-slice verdict persisted to `.verify-all-progress.json`. Resumable — re-running skips already-passed slices. Hours-long. Manual.
invocation:
  type: internal
  method: ""
  path: ""
chat_agent:
  when_to_call: pre-release / quarterly audit / after a sweeping refactor — the developer's full "prove every feature still works" pass
  when_not_to_call: routine validation (B / B.5 / D), updaters (A / C / E), code-only (Pristine), random sampling (Verify-All-Random)
  natural_language_examples:
    - "mode verify-all"
    - "deep ceremony"
    - "prove every feature"
  confirm_before: "yes — hours-long; mutates every slice's lock"
  summarize_after_success: "Mode Verify-All: PASS — every slice green + relocked"
  summarize_after_failure: "Mode Verify-All: FAIL — <count> slices left unlocked"
cross_cutting:
  wcag: "n/a — CLI"
  auth: "filesystem + spawn + git"
  mobile: "n/a — CLI"
  i18n: "operator-log English-only"
links:
  flows:
    - flows/main.flow.yaml
