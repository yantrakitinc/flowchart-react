flow: main
kind: helper
source: verify-mode-verify-all.mjs
symbol: main
inputs:
  io: optional IO ports — rootDir / findLocks / slices / progressPath / resume / spawn / execPath / modeAPath / modePristineAndCompliancePath / unlock / write / writeErr / now / readFile / writeFile
returns:
  - "{ exitCode: 0 | 1, rows: Array<{ slice: string, verdict: 'pass' | 'fail', lastRun: string }> }"
throws: []
calls:
  - findAllLocks (scripts/verify-mode-inspect/verify-mode-inspect.mjs)
  - slicesFromLocks (scripts/verify-mode-e/verify-mode-e.mjs)
  - unlockLock (scripts/verify-mode-a/verify-mode-a.mjs)
  - spawnSync (node:child_process) — invokes verify-mode-pristine-and-compliance, then verify-mode-a
  - loadProgress / saveProgress (local helpers)
called_by:
  - cliMain
  - scripts/verify-mode-verify-all-random/verify-mode-verify-all-random.mjs (composed)
emits_events: []
side_effects_on_success: ["per-slice lock files mutated (unlock then relock); .verify-all-progress.json updated"]
side_effects_on_failure: ["partial state; failed slices remain status:unlocked; .verify-all-progress.json records the verdict"]
transaction: none
spec: ../spec.yaml
ai_agent_action:
  when_to_call: pre-release / quarterly audit
  when_not_to_call: routine validation; per-slice updates
  natural_language_examples:
    - "mode verify-all"
    - "prove every feature"
  agent_invocation: "internal — `node scripts/verify-mode-verify-all/verify-mode-verify-all.mjs`"
  confirm_with_user_before: "hours-long; mutates every lock"
  summarize_to_user_after: "per-slice verdict count + names of any failures"
paths:
  happy:
    - findLocks returns N locks → slicesFromLocks dedups → S slices
    - per slice: unlock → Pristine+Compliance pass → Mode A relock 0 → row.verdict=pass; save progress
    - all S slices pass; exit 0
  edge_resume:
    - .verify-all-progress.json exists; slices marked verdict=pass are skipped; remaining slices processed
  error_unlock_fail:
    - unlockLock throws (lock file missing / unwritable); row.verdict=fail; save; continue
  error_pristine_and_compliance_fail:
    - composite gate exits non-zero; slice remains status:unlocked; row.verdict=fail; save; continue
  error_mode_a_fail:
    - Mode A relock returns non-zero; slice remains status:unlocked; row.verdict=fail; save; continue
