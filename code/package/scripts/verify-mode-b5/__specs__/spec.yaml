feature_name: scripts-verify-mode-b5
version: 1
operation:
  name: Verifier Mode B.5 — uncommitted-working-tree stamp + freshness check
  slug: "(internal)"
  description: Working-tree-scoped stamp + freshness gate. Scope = staged + unstaged + untracked (`git status --porcelain`). For each owning slice's lock, asserts shape + freshness (same checks as Mode B / D / F). Read-only. Refuses any slice whose status is `unlocked`.
invocation:
  type: internal
  method: ""
  path: ""
chat_agent:
  when_to_call: validate uncommitted edits' stamps (e.g., right before staging+commit)
  when_not_to_call: HEAD-level (Mode B), branch-level (Mode D), entire-repo (Mode F)
  natural_language_examples:
    - "mode B.5"
    - "validate my uncommitted stamps"
    - "check stamps before I stage"
  confirm_before: "none — read-only"
  summarize_after_success: "Mode B.5: PASS — all working-tree stamps locked + fresh"
  summarize_after_failure: "Mode B.5: FAIL — <count> stamps failed shape or freshness"
cross_cutting:
  wcag: "n/a — CLI"
  auth: "filesystem + git only"
  mobile: "n/a — CLI"
  i18n: "operator-log English-only"
links:
  flows:
    - flows/main.flow.yaml
