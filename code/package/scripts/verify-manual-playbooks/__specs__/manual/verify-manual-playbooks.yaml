flow: verify-manual-playbooks
start: "shell at <repo>/code/web"
preconditions:
  - "pnpm install has run"
  - "working tree is in the state to be verified"
steps:
  - action: "Invoke the script directly"
    selector: ""
    input: "node scripts/verify-manual-playbooks/verify-manual-playbooks.mjs"
    expected: "either an OK line on stdout (exit 0) or a MISSING block on stderr (exit 1)"
    assertion: "stdout contains 'verify-manual-playbooks: OK' OR stderr contains 'verify-manual-playbooks:' with exit code 1"
  - action: "Pick a route folder that already has a __specs__/manual/<basename>.yaml playbook"
    selector: ""
    input: "ls src/app/api/v1/admin/jobs/__specs__/manual"
    expected: "you see one or more .yaml playbook files"
    assertion: "ls output contains at least one .yaml file"
  - action: "Temporarily move the playbook aside"
    selector: ""
    input: "mv src/app/api/v1/admin/jobs/__specs__/manual/get.yaml /tmp/get.yaml.bak"
    expected: "the playbook is gone from disk"
    assertion: "ls src/app/api/v1/admin/jobs/__specs__/manual does not show get.yaml"
  - action: "Re-run the script"
    selector: ""
    input: "node scripts/verify-manual-playbooks/verify-manual-playbooks.mjs"
    expected: "exit 1 with a MISSING line naming the relocated playbook"
    assertion: "exit code is 1 AND stderr contains 'MISSING __specs__/manual/get.yaml'"
  - action: "Restore the playbook"
    selector: ""
    input: "mv /tmp/get.yaml.bak src/app/api/v1/admin/jobs/__specs__/manual/get.yaml"
    expected: "tree returns to its starting state"
    assertion: "git status shows no leftover changes"
assertions:
  - "Exit code 0 on a clean working tree"
  - "Exit code 1 when a flow doc has no matching playbook"
  - "MISSING line names the EXPECTED canonical path (.yaml first)"
failure_capture:
  - "stderr → /tmp/verify-manual-playbooks.stderr.txt for triage"
