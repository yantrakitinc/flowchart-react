feature_name: scripts-verify-manual-playbooks
version: 1
operation:
  name: Verify manual playbooks
  slug: "(internal)"
  description: "Walks src/app/ and asserts every user-facing route folder has a sibling manual playbook (__specs__/manual/<basename>.yaml or __manual__/<basename>.md) with all required section headers when markdown."
invocation:
  type: internal
  method: ""
  path: ""
chat_agent:
  when_to_call: User asks "do all routes have manual playbooks?" or as part of pnpm verify.
  when_not_to_call: Mid-feature work where a new route is in flight and the playbook hasn't landed yet.
  natural_language_examples:
    - "verify manual playbooks"
    - "every route has a __manual__ playbook?"
    - "any missing manual playbooks?"
  confirm_before: "none — read-only"
  summarize_after_success: "verify-manual-playbooks: OK (<N> user-facing folder(s) checked, <M> playbook(s) with all 4 sections present)"
  summarize_after_failure: "verify-manual-playbooks: <N> issue(s) — <list>"
cross_cutting:
  wcag: "n/a — CLI script"
  auth: "none — filesystem-only"
  mobile: "n/a — CLI script"
  i18n: "none — script output is English-only operator log"
links:
  flows:
    - flows/main.flow.yaml
    - flows/audit.flow.yaml
    - flows/is-user-facing-surface-folder.flow.yaml
    - flows/list-flow-basenames.flow.yaml
    - flows/check-playbook.flow.yaml
    - flows/check-headers.flow.yaml
  tests:
    - __tests__/verify-manual-playbooks.test.mjs
  manual:
    - manual/verify-manual-playbooks.yaml
