flow: listFlowBasenames
kind: pure-helper
source: scripts/verify-manual-playbooks/verify-manual-playbooks.mjs
symbol: listFlowBasenames
inputs:
  folder: absolute surface folder
  injected: optional IO injection (existsSync / statFile / readDir)
returns:
  - "string[] of basenames (no .flow.md suffix)"
throws: []
calls:
  - existsSync
  - statSync
  - readdirSync
called_by:
  - audit
emits_events: []
side_effects_on_success: ["none"]
side_effects_on_failure: "none"
transaction: none
test: scripts/verify-manual-playbooks/__tests__/verify-manual-playbooks.test.mjs
spec: scripts/verify-manual-playbooks/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "internal — only audit calls this"
  when_not_to_call: "external callers"
  natural_language_examples: []
  agent_invocation: "internal — not callable"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "n/a — internal helper"
paths:
  happy:
    - __specs__/flows/ exists and contains *.flow.md files; return their basenames
  edge_no_flows_dir:
    - __specs__/flows/ does not exist; return []
  edge_flows_path_not_dir:
    - __specs__/flows/ exists but is a file (not a directory); return []
  edge_stat_throws:
    - statSync throws; swallow, return []
  edge_only_non_flow_files:
    - directory has files that don't end with .flow.md; return []
