flow: checkPlaybook
kind: predicate
source: scripts/verify-manual-playbooks/verify-manual-playbooks.mjs
symbol: checkPlaybook
inputs:
  folder: absolute surface folder
  basename: flow basename
  injected: optional IO injection (existsSync)
returns:
  - "{ ok: true, expected, files }"
  - "{ ok: false, expected, files: [] }"
throws: []
calls:
  - existsSync
called_by:
  - audit
emits_events: []
side_effects_on_success: ["none"]
side_effects_on_failure: "none"
transaction: none
test: scripts/verify-manual-playbooks/__tests__/verify-manual-playbooks.test.mjs
spec: scripts/verify-manual-playbooks/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "internal — only audit calls this"
  when_not_to_call: "external callers"
  natural_language_examples: []
  agent_invocation: "internal — not callable"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "n/a — internal helper"
paths:
  new_yaml:
    - __specs__/manual/<basename>.yaml exists; return ok=true with that file
  legacy_single_md:
    - __manual__/<basename>.md exists; return ok=true with that file
  legacy_split:
    - both __manual__/<basename>.extension.md AND __manual__/<basename>.manual.md exist; return ok=true with both files
  missing:
    - none of the accepted shapes exist; return ok=false
  edge_extension_only:
    - only __manual__/<basename>.extension.md exists (manual.md missing); return ok=false (split-audience requires both)
  edge_manual_only:
    - only __manual__/<basename>.manual.md exists (extension.md missing); return ok=false (split-audience requires both)
