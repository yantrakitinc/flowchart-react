flow: main
kind: composition-root
source: scripts/verify-manual-playbooks/verify-manual-playbooks.mjs
symbol: main
inputs:
  io: optional IO injection (app / listDirs / readDir / statFile / existsSync / readFile / write / writeErr)
returns:
  - "{ exitCode: 0 }"
  - "{ exitCode: 1 }"
throws: []
calls:
  - audit
  - formatReport
called_by:
  - cliMain
  - scripts/verify-mode-compliance.mjs
emits_events: []
side_effects_on_success:
  - "stdout: 'verify-manual-playbooks: OK (<N> user-facing folder(s) checked, ...)'"
side_effects_on_failure: "stderr emits one summary line + one MISSING / MISSING_HEADER line per offender; process exits 1"
transaction: none
test: scripts/verify-manual-playbooks/__tests__/verify-manual-playbooks.test.mjs
spec: scripts/verify-manual-playbooks/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "Whenever the user asks 'do all routes have manual playbooks?' or as part of pnpm verify."
  when_not_to_call: "Mid-feature work where the playbook hasn't landed yet."
  natural_language_examples:
    - "verify manual playbooks"
  agent_invocation: "internal — invoked by scripts/verify-mode-compliance.mjs"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "Quote stdout/stderr verbatim."
paths:
  happy:
    - audit walks src/app/, every surface folder has a playbook for every flow
    - zero issues → OK stdout, exitCode 0
  error_issues_found:
    - audit collects one or more MISSING / MISSING_HEADER issues
    - formatReport emits summary + per-issue lines on stderr; exitCode 1
