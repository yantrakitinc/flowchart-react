flow: verify-mode-compliance
start: "shell at <repo>/code/web"
preconditions:
  - "pnpm install has run"
  - "working tree is in the state to be verified"
  - "for --scope mode: a git working tree with origin/master fetchable"
steps:
  - action: "Run the default (non-scope, non-full) mode"
    selector: ""
    input: "pnpm verify"
    expected: "every script's buffered output replayed in catalog order, ending with 'verify-mode-compliance: OK (all N scripts passed) in <S>s' on stdout"
    assertion: "exit code is 0 AND stdout final line matches /^verify-mode-compliance: OK \\(all \\d+ scripts passed\\)/"
  - action: "Run the --full mode"
    selector: ""
    input: "pnpm verify:full"
    expected: "freshness gate also runs; final line reads 'verify-mode-compliance (full): OK (all N scripts passed) in <S>s'"
    assertion: "exit code is 0 AND stdout final line matches /^verify-mode-compliance \\(full\\): OK \\(all \\d+ scripts passed\\)/"
  - action: "Run the --scope mode against a working tree with at least one changed file"
    selector: ""
    input: "pnpm verify --scope"
    expected: "scripts whose territory is disjoint print as 'verify-mode-compliance: SKIP <id> (<reason>)' before the run; final line reads 'verify-mode-compliance (scoped): OK (R of T scripts ran, K skipped) in <S>s'"
    assertion: "exit code is 0 AND stdout contains at least one SKIP line AND the final line matches /^verify-mode-compliance \\(scoped\\): OK/"
  - action: "Force a scope fallback by running --scope against a clean tree"
    selector: ""
    input: "git diff origin/master --quiet -- . && pnpm verify --scope"
    expected: "stderr emits 'verify-mode-compliance: --scope requested but no changed paths detected (... Falling back to a full run.'"
    assertion: "exit code is 0 AND stderr contains 'Falling back to a full run'"
  - action: "Force a failure to verify the aggregate error report"
    selector: ""
    input: "pnpm verify (after deliberately breaking one spec.yaml or removing a __specs__/standards-compliance.yaml lock)"
    expected: "stderr ends with 'verify-mode-compliance: N script(s) failed (of M that ran)' followed by one 'FAIL: <id> (exit <code>)' line per failure"
    assertion: "exit code is 1 AND stderr matches /verify-mode-compliance: \\d+ script\\(s\\) failed/"
  - action: "Capture the wall-clock timing for comparison"
    selector: ""
    input: "time pnpm verify"
    expected: "the 'real' line of /usr/bin/time reports a wall-clock time at or below the slowest single script (~60s on a developer Mac, dominated by verify-eslint-permission-rules) plus a small queue tail for the parallel pool. The slowest single script is the floor — parallelism cannot beat it."
    assertion: "real time is approximately the slowest-single-script wall-clock (verify-eslint-permission-rules, ~60s) plus a small queue tail — NOT meaningfully larger than that floor"
assertions:
  - "Exit code 0 on a clean working tree"
  - "Exit code 1 with precise per-script FAIL lines when at least one gate fails"
  - "Per-script output is contiguous (no interleaving between scripts)"
  - "Catalog order is preserved on stdout"
  - "Phase 2 always runs strictly after Phase 1"
failure_capture:
  - "Tee the orchestrator output: pnpm verify 2>&1 | tee /tmp/verify-mode-compliance.log"
