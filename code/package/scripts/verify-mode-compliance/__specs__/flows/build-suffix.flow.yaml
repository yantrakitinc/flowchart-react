flow: buildSuffix
kind: pure-helper
source: scripts/verify-mode-compliance/verify-mode-compliance.mjs
symbol: buildSuffix
inputs:
  mode: "{ full: boolean, scope: boolean }"
  ran: "number of scripts that actually ran"
  skipped: "number of scripts that were skipped"
  totalMs: "wall-clock duration of both phases combined"
returns:
  - "string — suffix appended after 'verify-mode-compliance'"
throws: []
calls: []
called_by:
  - main
emits_events: []
side_effects_on_success: ["none — pure formatter"]
side_effects_on_failure: "n/a"
transaction: none
test: scripts/verify-mode-compliance/__tests__/verify-mode-compliance.test.mjs
spec: scripts/verify-mode-compliance/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "internal — only main composes buildSuffix"
  when_not_to_call: "external callers"
  natural_language_examples: []
  agent_invocation: "internal — not callable"
  confirm_with_user_before: "none"
  summarize_to_user_after: "n/a — internal helper"
paths:
  happy_default:
    - mode.scope=false + mode.full=false → ': OK (all N scripts passed) in S.Ss'
  happy_full:
    - mode.scope=false + mode.full=true → ' (full): OK (all N scripts passed) in S.Ss'
  happy_scope:
    - mode.scope=true → ' (scoped): OK (R of T scripts ran, K skipped) in S.Ss'
  happy_scope_plus_full:
    - mode.scope=true + mode.full=true → uses the scoped suffix (the scope branch wins)
