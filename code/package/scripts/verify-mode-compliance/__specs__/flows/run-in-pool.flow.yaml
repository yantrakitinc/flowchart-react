flow: runInPool
kind: pure-helper
source: scripts/verify-mode-compliance/verify-mode-compliance.mjs
symbol: runInPool
inputs:
  items: "ReadonlyArray<T>"
  worker: "(item: T) => Promise<R>"
  concurrency: "number ≥ 1 (capped at items.length)"
returns:
  - "R[] — same length and order as items"
throws: []
calls:
  - worker (concurrently, up to `concurrency` in flight)
called_by:
  - main (Phase 1)
emits_events: []
side_effects_on_success: ["none — pure orchestration"]
side_effects_on_failure: "none — pure orchestration"
transaction: none
test: scripts/verify-mode-compliance/__tests__/verify-mode-compliance.test.mjs
spec: scripts/verify-mode-compliance/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "internal — only main composes runInPool"
  when_not_to_call: "external callers"
  natural_language_examples: []
  agent_invocation: "internal — not callable"
  confirm_with_user_before: "none — pure"
  summarize_to_user_after: "n/a — internal helper"
paths:
  happy:
    - cap = min(concurrency, items.length); workers race on a shared cursor
    - results are written into a positional array so input order is preserved on return
  edge_empty_items:
    - items.length === 0 → cap = 1 (Math.max(1,...)) but next() short-circuits → returns []
  edge_concurrency_higher_than_items:
    - cap clamped to items.length so we never spawn more workers than needed
