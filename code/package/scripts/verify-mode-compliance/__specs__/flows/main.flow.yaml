flow: main
kind: composition-root
source: scripts/verify-mode-compliance/verify-mode-compliance.mjs
symbol: main
inputs:
  io: optional IO injection (argv / rootDir / catalog / runEntry / concurrency / getChanged / write / writeErr / now)
returns:
  - "{ exitCode: 0 }"
  - "{ exitCode: 1 }"
throws: []
calls:
  - parseArgs
  - planRun
  - runInPool
  - runOne
  - replayResults
  - buildSuffix
  - getChangedPaths
called_by:
  - cliMain
  - pnpm verify
  - pnpm verify:full
  - pnpm verify --scope
emits_events: []
side_effects_on_success:
  - "stdout: 'verify-mode-compliance: OK (all <N> scripts passed) in <S>s'"
  - "phase-2 writers rewrite public/agents-permissions.json + public/agents.json"
side_effects_on_failure: "stderr emits summary + one FAIL line per failure; process exits 1"
transaction: none
test: scripts/verify-mode-compliance/__tests__/verify-mode-compliance.test.mjs
spec: scripts/verify-mode-compliance/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "Every commit / push / 'are we 100% compliant?' check."
  when_not_to_call: "Mid-feature work where gates are expected to fail."
  natural_language_examples:
    - "pnpm verify"
    - "pnpm verify --scope"
    - "pnpm verify:full"
  agent_invocation: "shell — invoked by the operator or git hooks"
  confirm_with_user_before: "none — read-only Phase 1 + idempotent Phase 2 writers"
  summarize_to_user_after: "Quote the final OK / failure line verbatim."
paths:
  happy_default:
    - parseArgs returns { full: false, scope: false }
    - planRun returns every entry except the fullOnly freshness gate
    - Phase 1 entries run in a worker pool (concurrency=6)
    - Phase 2 entries run sequentially
    - every script exited 0 → exitCode 0
  happy_full:
    - parseArgs returns { full: true, scope: false }
    - planRun includes the freshness gate
    - exitCode 0 when all 15 pass
  happy_scope:
    - parseArgs returns { full: false, scope: true }
    - getChangedPaths returns a non-empty list
    - planRun filters entries by territory ∩ changed
    - SKIP lines emit upfront; remaining scripts run
    - exitCode 0 when all that ran passed
  edge_scope_no_changes:
    - getChangedPaths returns []
    - stderr emits 'Falling back to a full run' notice
    - mode.scope set false; every entry runs
  error_failures:
    - one or more scripts exited non-zero
    - stderr emits one summary + one FAIL line per failure
    - exitCode 1
