feature_name: scripts-verify-mode-compliance
version: 1
operation:
  name: Verify-all orchestrator (scope-aware + parallel)
  slug: "(internal)"
  description: Aggregate runner for every verify-* / aggregate-* / generate-* gate. Runs Phase-1 read-only scripts in a capped-concurrency pool, then Phase-2 writers (aggregate-permissions → generate-agents-json) sequentially. Supports `--full` (adds the freshness gate) and `--scope` (skips scripts whose territory does not intersect changed paths vs origin/master).
invocation:
  type: internal
  method: ""
  path: ""
chat_agent:
  when_to_call: User asks "run pnpm verify" / "are all gates green?" / before a commit or push.
  when_not_to_call: Mid-feature work — partial code legitimately fails some gates until the slice is complete.
  natural_language_examples:
    - "pnpm verify"
    - "pnpm verify --scope"
    - "pnpm verify:full"
    - "run all verify gates"
  confirm_before: "none — read-only by default; the writer phase (aggregate-permissions + generate-agents-json) idempotently rewrites two on-disk manifests"
  summarize_after_success: "verify-mode-compliance: OK (all <N> scripts passed) in <S>s — quote verbatim"
  summarize_after_failure: "verify-mode-compliance: <N> script(s) failed — quote the FAIL lines verbatim"
cross_cutting:
  wcag: "n/a — CLI orchestrator"
  auth: "none — filesystem + child process only"
  mobile: "n/a — CLI orchestrator"
  i18n: "none — script output is English-only operator log"
links:
  flows:
    - flows/main.flow.yaml
    - flows/plan-run.flow.yaml
    - flows/run-one.flow.yaml
    - flows/run-in-pool.flow.yaml
    - flows/replay-results.flow.yaml
    - flows/build-suffix.flow.yaml
  tests:
    - __tests__/verify-mode-compliance.test.mjs
  manual:
    - manual/verify-mode-compliance.yaml
