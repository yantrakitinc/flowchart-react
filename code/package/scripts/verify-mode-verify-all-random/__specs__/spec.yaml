feature_name: scripts-verify-mode-verify-all-random
version: 1
operation:
  name: Verifier Mode Verify-All-Random — random ~20% subset of Mode Verify-All
  slug: "(internal)"
  description: Picks a uniform-random ~20% sample of every slice in the repo (minimum 1) and runs Mode Verify-All over the sample. Same per-slice ceremony (unlock → Pristine+Compliance → Mode A relock); narrower scope. Cheap probabilistic deep audit.
invocation:
  type: internal
  method: ""
  path: ""
chat_agent:
  when_to_call: routine probabilistic deep audit when full Verify-All is too expensive
  when_not_to_call: full deep ceremony (Mode Verify-All) or any timestamp-tier mode
  natural_language_examples:
    - "mode verify-all random"
    - "spot-check 20% of slices end-to-end"
  confirm_before: "yes — mutates sampled slices' locks"
  summarize_after_success: "Mode Verify-All-Random: PASS — sample of <N> slices green"
  summarize_after_failure: "Mode Verify-All-Random: FAIL — <count> slices left unlocked"
cross_cutting:
  wcag: "n/a — CLI"
  auth: "filesystem + spawn"
  mobile: "n/a — CLI"
  i18n: "operator-log English-only"
links:
  flows:
    - flows/main.flow.yaml
