flow: verify-setup-headers
start: "shell at <repo>/code/web"
preconditions:
  - "pnpm install has run"
  - "working tree is in the state to be verified"
steps:
  - action: "Invoke the script directly"
    selector: ""
    input: "node scripts/verify-setup-headers/verify-setup-headers.mjs"
    expected: "either an OK line on stdout (exit 0) or a list of MISSING / UNEXPECTED issues on stderr (exit 1)"
    assertion: "stdout contains 'verify-setup-headers: OK' OR stderr contains 'verify-setup-headers:' with exit code 1"
  - action: "Pick a known setup file and remove its marker"
    selector: ""
    input: "sed -i.bak '/SETUP FILE\\./d' src/db/client/client.ts"
    expected: "the marker is removed from the head of client.ts"
    assertion: "grep -c 'SETUP FILE' src/db/client/client.ts returns 0"
  - action: "Re-run the script"
    selector: ""
    input: "node scripts/verify-setup-headers/verify-setup-headers.mjs"
    expected: "exit 1 with a MISSING SETUP header line naming src/db/client/client.ts"
    assertion: "exit code is 1 AND stderr contains 'MISSING SETUP header: src/db/client/client.ts'"
  - action: "Restore the file"
    selector: ""
    input: "mv src/db/client/client.ts.bak src/db/client/client.ts"
    expected: "the marker is restored"
    assertion: "git status shows no leftover changes for src/db/client/client.ts"
  - action: "Plant an UNEXPECTED marker on a normal file"
    selector: ""
    input: "(echo '// SETUP FILE.' && cat src/lib/clock/types/types.ts) > /tmp/types.ts.new && mv /tmp/types.ts.new src/lib/clock/types/types.ts"
    expected: "the marker is at the top of an ordinary file"
    assertion: "head -3 src/lib/clock/types/types.ts shows the marker"
  - action: "Re-run the script and clean up"
    selector: ""
    input: "node scripts/verify-setup-headers/verify-setup-headers.mjs; git checkout src/lib/clock/types/types.ts"
    expected: "exit 1 with an UNEXPECTED SETUP header line; tree restored after checkout"
    assertion: "exit code is 1 in the first invocation; git status is clean after checkout"
assertions:
  - "Exit code 0 on a clean working tree"
  - "Exit code 1 when a required setup file is missing the marker"
  - "Exit code 1 when an off-convention file carries the marker"
failure_capture:
  - "stderr → /tmp/verify-setup-headers.stderr.txt for triage"
