feature_name: scripts-verify-setup-headers
version: 1
operation:
  name: Verify SETUP FILE headers
  slug: "(internal)"
  description: Walks src/ and asserts every file matching the SETUP convention carries the `SETUP FILE.` marker, AND no off-convention file self-declares as setup.
invocation:
  type: internal
  method: ""
  path: ""
chat_agent:
  when_to_call: User asks "are the SETUP headers in good shape?" or as part of pnpm verify.
  when_not_to_call: Mid-feature work where new schema / port files may not yet carry the marker.
  natural_language_examples:
    - "verify setup headers"
    - "any missing SETUP FILE markers?"
    - "any rogue SETUP FILE markers outside the convention?"
  confirm_before: "none — read-only"
  summarize_after_success: "verify-setup-headers: OK (<N> required setup file(s) checked)"
  summarize_after_failure: "verify-setup-headers: <N> issue(s) — <list>"
cross_cutting:
  wcag: "n/a — CLI script"
  auth: "none — filesystem-only"
  mobile: "n/a — CLI script"
  i18n: "none — script output is English-only operator log"
links:
  flows:
    - flows/main.flow.yaml
    - flows/audit.flow.yaml
    - flows/classify.flow.yaml
    - flows/has-setup-header.flow.yaml
    - flows/is-candidate-source-file.flow.yaml
    - flows/glob-to-regex.flow.yaml
  tests:
    - __tests__/verify-setup-headers.test.mjs
  manual:
    - manual/verify-setup-headers.yaml
