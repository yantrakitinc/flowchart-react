flow: isCandidateSourceFile
kind: predicate
source: scripts/verify-setup-headers/verify-setup-headers.mjs
symbol: isCandidateSourceFile
inputs:
  file: absolute file path
returns:
  - "true when the file is a candidate for SETUP-header inspection"
  - "false for non-ts files, .d.ts, .test.*, files under __tests__/ or __specs__/, and index barrels"
throws: []
calls: []
called_by:
  - audit
emits_events: []
side_effects_on_success: ["none"]
side_effects_on_failure: "none"
transaction: none
test: scripts/verify-setup-headers/__tests__/verify-setup-headers.test.mjs
spec: scripts/verify-setup-headers/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "internal — only audit calls this"
  when_not_to_call: "external callers"
  natural_language_examples: []
  agent_invocation: "internal — not callable"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "n/a — internal helper"
paths:
  accept_ts:
    - file ends with .ts (and is not .d.ts / .test.ts / index.ts / under __tests__/ / __specs__/)
    - return true
  accept_tsx:
    - file ends with .tsx and is not under __tests__/ / __specs__/ and is not .test.tsx
    - return true
  reject_non_ts:
    - file does not end with .ts or .tsx → return false
  reject_declaration:
    - file ends with .d.ts → return false
  reject_test:
    - file ends with .test.ts / .test.tsx → return false
  reject_tests_specs_artifact:
    - file path contains /__tests__/ or /__specs__/ → return false
  reject_index_barrel:
    - file ends with /index.ts → return false
