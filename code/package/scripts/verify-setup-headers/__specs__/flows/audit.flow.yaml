flow: audit
kind: service-method
source: scripts/verify-setup-headers/verify-setup-headers.mjs
symbol: audit
inputs:
  srcRoot: absolute path to the src/ root
  injected: optional IO injection (listFiles / readFile / existsSync)
returns:
  - "{ errors, checked, srcMissing }"
throws: []
calls:
  - listAllFiles (default port)
  - isCandidateSourceFile
  - classify
  - hasSetupHeader
called_by:
  - main
emits_events: []
side_effects_on_success: ["none"]
side_effects_on_failure: "none"
transaction: none
test: scripts/verify-setup-headers/__tests__/verify-setup-headers.test.mjs
spec: scripts/verify-setup-headers/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "internal — only main composes audit"
  when_not_to_call: "external callers"
  natural_language_examples: []
  agent_invocation: "internal — not callable"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "n/a — internal helper"
paths:
  happy:
    - walk every file under srcRoot
    - skip non-candidates (non-ts, .d.ts, .test.*, __tests__/, __specs__/, /index.ts)
    - for each candidate, classify + read first 30 lines; record any mismatch
  error_required_but_missing:
    - file matches a SETUP convention but does NOT carry 'SETUP FILE.' in the head
    - record MISSING error
  error_unexpected_marker:
    - file does NOT match any SETUP convention but DOES carry 'SETUP FILE.' in the head
    - record UNEXPECTED error
  edge_src_missing:
    - srcRoot does not exist; return srcMissing=true and empty errors
