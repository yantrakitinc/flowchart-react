flow: runAudit
kind: helper
source: scripts/verify-no-server-imports/verify-no-server-imports.mjs
symbol: runAudit
inputs:
  rootDir: absolute path to the frontend root (defaults to module-resolved frontend/)
returns:
  - "number — 0 on PASS, 1 on any violation"
throws: []
calls:
  - collectFiles
  - auditFile
  - findViolations
called_by:
  - maybeRunCli (CLI dispatcher)
  - test suite
emits_events: []
side_effects_on_success: ["writes one PASS line to stdout"]
side_effects_on_failure: ["writes violation summary + per-line breakdown to stderr"]
transaction: none
test: scripts/verify-no-server-imports/__tests__/verify-no-server-imports.test.mjs
spec: scripts/verify-no-server-imports/__specs__/spec.yaml
ai_agent_action:
  when_to_call: pre-push boundary verification; pnpm verify chain
  when_not_to_call: mid-feature work
  natural_language_examples:
    - "run G-FRONTEND-BOUNDARY"
    - "check the frontend boundary"
  agent_invocation: "internal — `node scripts/verify-no-server-imports/verify-no-server-imports.mjs`"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "PASS line OR violation breakdown verbatim"
paths:
  happy:
    - collectFiles enumerates every .ts/.tsx under src/ (skipping node_modules, .next, dist)
    - auditFile applies findViolations per file
    - no violations found → emit PASS line + return 0
  error_violation_found:
    - findViolations matches a specifier against FORBIDDEN_SPECIFIER_PATTERNS
    - emit violation summary + per-line breakdown to stderr + return 1
  edge_unreadable_file:
    - readFileSync throws (permission / race); auditFile returns null and the file is skipped
  edge_unreadable_dir:
    - readdirSync throws on a subdirectory; collectFiles skips it silently
