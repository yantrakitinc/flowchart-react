flow: main
kind: helper
source: verify-mode-pristine-and-compliance.mjs
symbol: main
inputs:
  io: optional IO ports — spawn / execPath / cwd / modePristinePath / modeCompliancePath / write / writeErr
returns:
  - "{ exitCode: 0 | 1, stages: Array<{ name: string, status: number }> }"
throws: []
calls:
  - spawnSync (node:child_process) — spawns verify-mode-pristine then verify-mode-compliance
called_by:
  - cliMain
  - scripts/verify-mode-verify-all/verify-mode-verify-all.mjs (per-feature inner loop)
emits_events: []
side_effects_on_success: ["each child mode's stdout relayed"]
side_effects_on_failure: ["chain stops at first non-zero"]
transaction: none
spec: ../spec.yaml
ai_agent_action:
  when_to_call: pre-merge gate
  when_not_to_call: scoped or single-mode runs
  natural_language_examples:
    - "mode pristine and compliance"
  agent_invocation: "internal — `node scripts/verify-mode-pristine-and-compliance/verify-mode-pristine-and-compliance.mjs`"
  confirm_with_user_before: "warn about minutes-long runtime"
  summarize_to_user_after: "verdict + which stage failed (if any)"
paths:
  happy:
    - pristine 0 → compliance 0; exit 0
  error_pristine_fails:
    - pristine non-zero; do not run compliance; exit 1
  error_compliance_fails:
    - pristine 0 then compliance non-zero; exit 1
