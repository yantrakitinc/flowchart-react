feature_name: scripts-verify-mode-pristine-and-compliance
version: 1
operation:
  name: Verifier Mode Pristine+Compliance — pre-merge composite gate
  slug: "(internal)"
  description: Spawns Mode Pristine; on exit 0, spawns Mode Compliance. First non-zero stops the chain. Manual / on-demand. The developer's pre-merge gate.
invocation:
  type: internal
  method: ""
  path: ""
chat_agent:
  when_to_call: pre-merge — once stamps are settled, run this to prove code-health AND standards-compliance both green
  when_not_to_call: scoped validators (B / B.5 / D), updaters (A / C / E), or code-only check (Pristine alone)
  natural_language_examples:
    - "mode pristine and compliance"
    - "pre-merge gate"
  confirm_before: "none — but expect minutes-long runtime"
  summarize_after_success: "Mode Pristine+Compliance: PASS"
  summarize_after_failure: "Mode Pristine+Compliance: FAIL at stage <pristine|compliance>"
cross_cutting:
  wcag: "n/a — CLI"
  auth: "filesystem + spawn"
  mobile: "n/a — CLI"
  i18n: "operator-log English-only"
links:
  flows:
    - flows/main.flow.yaml
