flow: main
kind: helper
source: verify-mode-f-random.mjs
symbol: main
inputs:
  io: optional IO ports — rootDir / findLocks / fraction / rng / readFile / gitLastCommit / write / writeErr / modeF
returns:
  - "{ exitCode: 0 | 1, locksChecked: string[], failures: Array<{ lock: string, gate: 'shape' | 'freshness', reason: string }> }"
throws: []
calls:
  - findAllLocks (scripts/verify-mode-inspect/verify-mode-inspect.mjs)
  - sampleSubset (local helper)
  - main (scripts/verify-mode-f/verify-mode-f.mjs) — invoked with sample passed via findLocks injection
called_by:
  - cliMain
emits_events: []
side_effects_on_success: ["none"]
side_effects_on_failure: ["none"]
transaction: none
spec: ../spec.yaml
ai_agent_action:
  when_to_call: routine probabilistic audit
  when_not_to_call: deterministic gates (Mode F / D / B / B.5)
  natural_language_examples:
    - "mode F-random"
  agent_invocation: "internal — `node scripts/verify-mode-f-random/verify-mode-f-random.mjs`"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "Mode F-Random verdict over the sample + sample size"
paths:
  happy:
    - findLocks returns N locks; sampleSubset picks ceil(N * fraction) min 1; verify-mode-f passes; exit 0
  edge_no_locks:
    - findLocks returns []; sample is []; verify-mode-f reports "no locks" + exit 0
  error_shape_fail:
    - any sampled lock fails shape; exit 1 with reasons
  error_freshness_fail:
    - any sampled lock fails freshness; exit 1 with reasons
