feature_name: scripts-verify-mode-f-random
version: 1
operation:
  name: Verifier Mode F-Random — random ~20% subset of Mode F
  slug: "(internal)"
  description: Picks a uniform-random ~20% sample of every `__specs__/standards-compliance.yaml` in the repo (minimum 1 lock when any exist) and runs Mode F over the sample. Same shape + freshness gates, narrower scope. Read-only.
invocation:
  type: internal
  method: ""
  path: ""
chat_agent:
  when_to_call: cheap probabilistic audit (e.g., as part of a routine cron); detects systemic stamp rot without paying full Mode F cost
  when_not_to_call: deterministic audit (Mode F) or scoped validators (B / B.5 / D)
  natural_language_examples:
    - "mode F-random"
    - "spot-check 20% of stamps"
  confirm_before: "none — read-only"
  summarize_after_success: "Mode F-Random: PASS — sample of <N> stamps locked + fresh"
  summarize_after_failure: "Mode F-Random: FAIL — <count> stamps failed in <N>-lock sample"
cross_cutting:
  wcag: "n/a — CLI"
  auth: "filesystem + git only"
  mobile: "n/a — CLI"
  i18n: "operator-log English-only"
links:
  flows:
    - flows/main.flow.yaml
