feature_name: scripts-verify-no-stray-scaffolding
version: 1
operation:
  name: Verify no stray scaffolding
  slug: "(internal)"
  description: Walks src/ (and e2e/ when present), flags any old-style scaffolding folders or files that escaped the locked __specs__/ landing zone.
invocation:
  type: internal
  method: ""
  path: ""
chat_agent:
  when_to_call: User asks "is the spec layout clean?" or before tagging compliant/<sha>; also as part of pnpm verify.
  when_not_to_call: During mid-feature work — files in flight may temporarily live outside __specs__/ before the writer moves them.
  natural_language_examples:
    - "any stray flows folders?"
    - "verify no stray scaffolding"
    - "is the __specs__ landing zone clean?"
  confirm_before: "none — read-only"
  summarize_after_success: "verify-no-stray-scaffolding: OK (no strays found)"
  summarize_after_failure: "verify-no-stray-scaffolding: <N> stray item(s) — <kinds>"
cross_cutting:
  wcag: "n/a — CLI script"
  auth: "none — filesystem-only"
  mobile: "n/a — CLI script"
  i18n: "none — script output is English-only operator log"
links:
  flows:
    - flows/main.flow.yaml
    - flows/audit.flow.yaml
    - flows/classify-dir-stray.flow.yaml
    - flows/classify-file-stray.flow.yaml
    - flows/is-inside-backup-folder.flow.yaml
  tests:
    - __tests__/verify-no-stray-scaffolding.test.mjs
  manual:
    - manual/verify-no-stray-scaffolding.yaml
