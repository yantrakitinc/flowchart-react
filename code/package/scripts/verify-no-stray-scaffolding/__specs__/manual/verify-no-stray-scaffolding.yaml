flow: verify-no-stray-scaffolding
start: "shell at <repo>/code/web"
preconditions:
  - "pnpm install has run"
  - "working tree is in the state to be verified"
steps:
  - action: "Invoke the script directly"
    selector: ""
    input: "node scripts/verify-no-stray-scaffolding/verify-no-stray-scaffolding.mjs"
    expected: "either an OK line on stdout (exit 0) or a STRAY block on stderr (exit 1)"
    assertion: "stdout contains 'verify-no-stray-scaffolding: OK' OR stderr contains 'verify-no-stray-scaffolding:' with exit code 1"
  - action: "Plant a stray flows directory outside __specs__/"
    selector: ""
    input: "mkdir -p src/db/client/flows && touch src/db/client/flows/get-db.flow.md"
    expected: "the stray exists on disk"
    assertion: "ls src/db/client/flows shows the new directory"
  - action: "Re-run the script"
    selector: ""
    input: "node scripts/verify-no-stray-scaffolding/verify-no-stray-scaffolding.mjs"
    expected: "exit 1 and a STRAY line naming src/db/client/flows"
    assertion: "exit code is 1 AND stderr contains 'STRAY: src/db/client/flows'"
  - action: "Remove the stray and add a __specs__.backup/ folder"
    selector: ""
    input: "rm -rf src/db/client/flows && mkdir -p src/db/client/__specs__.backup/flows && touch src/db/client/__specs__.backup/CODE_CONFIDENCE.md"
    expected: "the backup folder exists; the script must skip it entirely"
    assertion: "ls src/db/client/__specs__.backup shows the new tree"
  - action: "Re-run the script"
    selector: ""
    input: "node scripts/verify-no-stray-scaffolding/verify-no-stray-scaffolding.mjs"
    expected: "the backup contents are ignored; exit 0"
    assertion: "stdout contains 'verify-no-stray-scaffolding: OK' AND exit code is 0"
  - action: "Clean up"
    selector: ""
    input: "rm -rf src/db/client/__specs__.backup"
    expected: "the working tree returns to its starting state"
    assertion: "git status shows no leftover scaffolding"
assertions:
  - "Exit code 0 on a clean working tree"
  - "Exit code 1 when an old-style scaffolding folder / file exists outside __specs__.backup/"
  - "__specs__.backup/ contents are skipped regardless of their shape"
failure_capture:
  - "stderr → /tmp/verify-no-stray-scaffolding.stderr.txt for triage"
