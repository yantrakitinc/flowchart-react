flow: main
kind: composition-root
source: scripts/verify-no-stray-scaffolding/verify-no-stray-scaffolding.mjs
symbol: main
inputs:
  io: optional IO injection (listDirs / listFiles / write / writeErr / src / e2e / rootDir)
returns:
  - "{ exitCode: 0 }"
  - "{ exitCode: 1 }"
throws: []
calls:
  - audit
  - formatReport
called_by:
  - cliMain
  - scripts/verify-mode-compliance.mjs
  - pnpm verify
emits_events: []
side_effects_on_success:
  - "stdout: 'verify-no-stray-scaffolding: OK (no strays found)'"
side_effects_on_failure: "stderr emits one summary line + one STRAY line per offender; process exits 1"
transaction: none
test: scripts/verify-no-stray-scaffolding/__tests__/verify-no-stray-scaffolding.test.mjs
spec: scripts/verify-no-stray-scaffolding/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "Whenever the user asks 'is the __specs__ layout clean?' or as part of pnpm verify."
  when_not_to_call: "During mid-feature work where files may legitimately be in flight."
  natural_language_examples:
    - "verify no stray scaffolding"
    - "any stray flows or specs folders?"
  agent_invocation: "internal — invoked by scripts/verify-mode-compliance.mjs"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "Quote the verbatim stdout/stderr line; on failure list each STRAY."
paths:
  happy:
    - audit walks src/ + e2e/ and finds zero strays
    - formatReport produces the OK stdout line
    - main returns exitCode 0
  error_strays_found:
    - audit returns one or more strays
    - formatReport produces a summary line + one STRAY line per offender
    - main returns exitCode 1
  edge_e2e_missing:
    - e2e/ does not exist on disk; listDirs/listFiles handle the missing root gracefully (the walk helpers swallow ENOENT)
    - main returns exitCode 0 if no other strays exist
