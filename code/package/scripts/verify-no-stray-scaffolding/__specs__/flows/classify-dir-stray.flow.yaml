flow: classifyDirStray
kind: predicate
source: scripts/verify-no-stray-scaffolding/verify-no-stray-scaffolding.mjs
symbol: classifyDirStray
inputs:
  dir: absolute directory path
returns:
  - "{ kind, detail } when dir is a stray shape"
  - "null when dir is fine"
throws: []
calls: []
called_by:
  - audit
emits_events: []
side_effects_on_success: ["none"]
side_effects_on_failure: "none"
transaction: none
test: scripts/verify-no-stray-scaffolding/__tests__/verify-no-stray-scaffolding.test.mjs
spec: scripts/verify-no-stray-scaffolding/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "internal — only audit calls this"
  when_not_to_call: "external callers"
  natural_language_examples: []
  agent_invocation: "internal — not callable"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "n/a — internal helper"
paths:
  happy:
    - dir is a normal feature folder; return null
  error_flows_outside_specs:
    - last segment is 'flows' and parent is not '__specs__'
    - return { kind: 'flows-outside-specs', detail: 'flows/ must live inside __specs__/' }
  error_wrong_specs_folder_specs:
    - last segment is 'specs'
    - return { kind: 'wrong-specs-folder', detail: 'must use __specs__/' }
  error_wrong_specs_folder_singular:
    - last segment is '__spec__'
    - return { kind: 'wrong-specs-folder', detail: 'must use __specs__/' }
  error_wrong_specs_folder_underscores:
    - last segment is '_specs_'
    - return { kind: 'wrong-specs-folder', detail: 'must use __specs__/' }
  edge_legitimate_flows:
    - last segment is 'flows' and parent IS '__specs__'
    - return null (legitimate __specs__/flows/ directory)
