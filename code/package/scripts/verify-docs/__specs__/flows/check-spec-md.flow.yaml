flow: checkSpecMd
kind: service-method
source: scripts/verify-docs/verify-docs.mjs
symbol: checkSpecMd
inputs:
  file: absolute path to spec.md
  relPath: display path
  injected: optional { readFile / existsSync } injection
returns:
  - "string[] — error list (empty when file is well-formed)"
throws: []
calls:
  - readFile (default)
  - existsSync (default)
  - extractH2
  - sectionBodies
  - isNewFormSpec
called_by:
  - audit
emits_events: []
side_effects_on_success: ["none"]
side_effects_on_failure: "none"
transaction: none
test: scripts/verify-docs/__tests__/verify-docs.test.mjs
spec: scripts/verify-docs/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "internal — only audit calls this"
  when_not_to_call: "external callers"
  natural_language_examples: []
  agent_invocation: "internal — not callable"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "n/a — internal helper"
paths:
  happy_legacy:
    - file has at least one ## heading; no duplicates; no empty sections
    - not NEW-form (lacks Invariants / Permissions used)
    - return []
  happy_new_form:
    - file carries ALL 10 SPEC_HEADINGS_NEW; no duplicates; no empty sections
    - any link in '## Flows' resolves to a real file
    - return []
  error_no_headings:
    - file has zero ## headings
    - return ['<rel>: no `## ` headings found']
  error_duplicate_heading:
    - same heading appears twice
    - return ['<rel>: duplicate heading "<h>"']
  error_empty_section:
    - heading present but no body content
    - return ['<rel>: section "## <h>" is empty (use "None." if intentional)']
  error_new_form_missing_heading:
    - NEW-form distinctive headings present but one of the 10 canonical headings is missing
    - return ['<rel>: NEW-form spec missing heading "## <h>" (SPEC_TEMPLATE.md)']
  error_new_form_dead_flow_link:
    - '## Flows' section references a flows/<x>.flow.md that does not exist
    - return ['<rel>: ## Flows links to "<target>" which does not exist']
