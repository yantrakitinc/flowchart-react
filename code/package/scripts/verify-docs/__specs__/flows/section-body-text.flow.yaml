flow: sectionBodyText
kind: helper
source: scripts/verify-docs/verify-docs.mjs
symbol: sectionBodyText
inputs:
  src: markdown source
  heading: heading text without the '## ' prefix
returns:
  - "string — body text between '## <heading>' and the next '## ' line (or end-of-file)"
  - "'' when the heading is absent"
throws: []
calls: []
called_by:
  - checkFlowMd (for '## Diagram' and '## Flow Diagram' mermaid-fence checks)
emits_events: []
side_effects_on_success: ["none"]
side_effects_on_failure: "none"
transaction: none
test: scripts/verify-docs/__tests__/verify-docs.test.mjs
spec: scripts/verify-docs/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "internal — only checkFlowMd calls this"
  when_not_to_call: "external callers"
  natural_language_examples: []
  agent_invocation: "internal — not callable"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "n/a — internal helper"
paths:
  happy_body_between_headings:
    - source contains '## <heading>' followed by body and a next '## ' line
    - return the body text between them
  happy_body_to_end:
    - source contains '## <heading>' as the last block (no next '## ' line)
    - return everything after the heading to end-of-file
  edge_heading_absent:
    - source does not contain '## <heading>'
    - return ''
  edge_regex_special_chars:
    - heading contains characters with regex meaning (spaces, parens)
    - escape them and still match the literal heading
