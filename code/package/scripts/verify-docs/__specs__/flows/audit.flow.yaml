flow: audit
kind: service-method
source: scripts/verify-docs/verify-docs.mjs
symbol: audit
inputs:
  roots: "{ src, e2e } — absolute paths"
  injected: optional IO injection
returns:
  - "{ errors, specsFoldersChecked, specsChecked, flowsChecked, ccChecked }"
throws: []
calls:
  - listAllDirs
  - listAllFiles
  - checkSpecsFolder
  - checkSpecMd
  - checkFlowMd
  - checkCodeConfidenceMd
called_by:
  - main
emits_events: []
side_effects_on_success: ["none"]
side_effects_on_failure: "none"
transaction: none
test: scripts/verify-docs/__tests__/verify-docs.test.mjs
spec: scripts/verify-docs/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "internal — only main composes audit"
  when_not_to_call: "external callers"
  natural_language_examples: []
  agent_invocation: "internal — not callable"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "n/a — internal helper"
paths:
  happy:
    - for each existing root, walk every directory; for each /__specs__ leaf, run checkSpecsFolder
    - for each existing root, walk every file; route by suffix to the matching per-file checker
    - aggregate all errors
  edge_e2e_missing:
    - e2e root does not exist → skipped without error
  edge_module_with_lock_only:
    - module-level __specs__/ has standards-compliance.yaml but no CODE_CONFIDENCE.md → accepted (dual-shape policy)
  edge_module_with_cc_only:
    - module-level __specs__/ has CODE_CONFIDENCE.md but no standards-compliance.yaml → accepted (legacy path)
  edge_module_with_neither:
    - module-level __specs__/ has neither → error
  edge_flows_dir_with_yaml_only:
    - __specs__/flows/ contains only *.flow.yaml → folder check passes; per-file shape check skips (no .flow.md to validate)
