flow: verify-docs
start: "shell at <repo>/code/web"
preconditions:
  - "pnpm install has run"
  - "working tree is in the state to be verified"
steps:
  - action: "Invoke the script directly"
    selector: ""
    input: "node scripts/verify-docs/verify-docs.mjs"
    expected: "either an OK line on stdout (exit 0) or a list of issues on stderr (exit 1)"
    assertion: "stdout contains 'verify-docs: OK' OR stderr contains 'verify-docs:' with exit code 1"
  - action: "Pick a module-level __specs__/ that already carries standards-compliance.yaml"
    selector: ""
    input: "ls src/features/identity/__specs__"
    expected: "you see spec.md plus either CODE_CONFIDENCE.md or standards-compliance.yaml"
    assertion: "ls output contains at least one of those files"
  - action: "Temporarily move CODE_CONFIDENCE.md aside"
    selector: ""
    input: "mv src/features/identity/__specs__/CODE_CONFIDENCE.md /tmp/CODE_CONFIDENCE.md.bak"
    expected: "the scorecard is gone but standards-compliance.yaml remains (if present)"
    assertion: "ls -la src/features/identity/__specs__ shows no CODE_CONFIDENCE.md"
  - action: "Re-run the script"
    selector: ""
    input: "node scripts/verify-docs/verify-docs.mjs"
    expected: "exit 0 because standards-compliance.yaml supersedes the scorecard; if no lock file exists, exit 1 with a MISSING line"
    assertion: "exit code reflects whether the new lock is present"
  - action: "Restore the scorecard"
    selector: ""
    input: "mv /tmp/CODE_CONFIDENCE.md.bak src/features/identity/__specs__/CODE_CONFIDENCE.md"
    expected: "tree returns to its starting state"
    assertion: "git status shows no leftover changes"
  - action: "Create a flows/ directory with only a *.flow.yaml file"
    selector: ""
    input: "mkdir -p /tmp/spec-test/__specs__/flows && touch /tmp/spec-test/__specs__/spec.md && echo '## Purpose\\ndemo' > /tmp/spec-test/__specs__/spec.md && touch /tmp/spec-test/__specs__/flows/demo.flow.yaml"
    expected: "demo tree has a populated flows/ directory using only the new shape"
    assertion: "ls /tmp/spec-test/__specs__/flows shows demo.flow.yaml"
  - action: "Drive main against the demo tree via node -e"
    selector: ""
    input: "node -e 'import(\"./scripts/verify-docs/verify-docs.mjs\").then(m => process.exit(m.main({ src: \"/tmp/spec-test\", e2e: \"/tmp/absent\" }).exitCode))'"
    expected: "exit 0 — the flows/ directory is non-empty (the .flow.yaml satisfies the dual-shape policy)"
    assertion: "exit code is 0"
  - action: "Clean up"
    selector: ""
    input: "rm -rf /tmp/spec-test"
    expected: "demo tree removed"
    assertion: "ls /tmp/spec-test errors with ENOENT"
assertions:
  - "Exit code 0 on a clean working tree"
  - "Exit code 1 with precise per-issue lines when a doc is malformed"
  - "Dual-shape policy: .flow.yaml satisfies the 'flows directory non-empty' check"
  - "standards-compliance.yaml satisfies the module-level scorecard requirement"
failure_capture:
  - "stderr → /tmp/verify-docs.stderr.txt for triage"
