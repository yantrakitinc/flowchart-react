flow: main
kind: helper
source: verify-mode-d.mjs
symbol: main
inputs:
  io: optional IO ports — rootDir / getChanged / readFile / gitLastCommit / write / writeErr
returns:
  - "{ exitCode: 0 | 1, locksChecked: string[], failures: Array<{ lock: string, gate: 'shape' | 'freshness', reason: string }> }"
throws: []
calls:
  - getChangedPaths (scripts/lib/changed-paths.mjs)
  - findSliceLock
  - locksFromChangedPaths
  - parseScalarFields
  - checkLockShape
  - checkFreshness (scripts/verify-standards-freshness/verify-standards-freshness.mjs)
  - defaultGitLastCommit (scripts/verify-standards-freshness/verify-standards-freshness.mjs)
called_by:
  - cliMain
  - test suite
emits_events: []
side_effects_on_success: ["none"]
side_effects_on_failure: ["none"]
transaction: none
test: __tests__/verify-mode-d.test.mjs
spec: ../spec.yaml
ai_agent_action:
  when_to_call: pre-push hook OR routine-push gate
  when_not_to_call: per-slice (Mode A) or full repo (Mode D)
  natural_language_examples:
    - "run mode B"
    - "stamp + freshness check before push"
  agent_invocation: "internal — `node scripts/verify-mode-d/verify-mode-d.mjs`"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "Mode B verdict + per-lock failure breakdown (shape OR freshness gate)"
paths:
  happy:
    - getChanged returns N changed paths
    - locksFromChangedPaths resolves each to its slice lock (deduped + sorted)
    - per-lock: shape check passes; freshness check passes (last commit ≤ last_validated + 30min grace)
    - print "verify-mode-d: OK" + exit 0
  edge_no_changes:
    - getChanged returns empty list; print "nothing to stamp-check" + exit 0
  edge_no_spec_slices:
    - changed paths don't resolve to any spec'd slice; print + exit 0
  error_shape_fail:
    - lock's status/verified/last_validated does not match the shape contract; record failure under gate="shape"; exit 1
  error_freshness_fail:
    - git log shows a commit on the slice folder AFTER last_validated + grace; record failure under gate="freshness"; exit 1
