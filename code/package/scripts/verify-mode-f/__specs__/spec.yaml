feature_name: scripts-verify-mode-f
version: 1
operation:
  name: Verifier Mode F — entire-repo stamp + freshness check
  slug: "(internal)"
  description: Repo-wide stamp + freshness gate. Walks every `__specs__/standards-compliance.yaml` in the repo via `findAllLocks` (from Mode Inspect) and runs the shape + freshness gates on each. Read-only. Refuses any slice whose status is `unlocked`.
invocation:
  type: internal
  method: ""
  path: ""
chat_agent:
  when_to_call: full-repo state validation (e.g., before a release tag or compliance audit)
  when_not_to_call: per-commit (Mode B), working-tree (B.5), branch (D), sample (F-Random)
  natural_language_examples:
    - "mode F"
    - "validate every stamp in the repo"
  confirm_before: "none — read-only"
  summarize_after_success: "Mode F: PASS — all repo stamps locked + fresh"
  summarize_after_failure: "Mode F: FAIL — <count> stamps failed shape or freshness"
cross_cutting:
  wcag: "n/a — CLI"
  auth: "filesystem + git only"
  mobile: "n/a — CLI"
  i18n: "operator-log English-only"
links:
  flows:
    - flows/main.flow.yaml
