flow: audit
kind: service-method
source: scripts/verify-eslint-permission-rules/verify-eslint-permission-rules.mjs
symbol: audit
inputs:
  fixtures: ReadonlyArray of fixture rows
  ports: "{ eslintBin, cwd, runEslint? }"
returns:
  - "{ errors, total }"
throws: []
calls:
  - checkFixture
called_by:
  - main
emits_events: []
side_effects_on_success: ["none"]
side_effects_on_failure: "none"
transaction: none
test: scripts/verify-eslint-permission-rules/__tests__/verify-eslint-permission-rules.test.mjs
spec: scripts/verify-eslint-permission-rules/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "internal — only main composes audit"
  when_not_to_call: "external callers"
  natural_language_examples: []
  agent_invocation: "internal — not callable"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "n/a — internal helper"
paths:
  happy:
    - every fixture passes; errors is []
  error_some_failed:
    - one or more fixtures fail; errors contains a string per failed fixture
  edge_zero_fixtures:
    - fixtures is empty; errors=[] and total=0
