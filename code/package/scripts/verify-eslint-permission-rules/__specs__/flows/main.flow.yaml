flow: main
kind: composition-root
source: scripts/verify-eslint-permission-rules/verify-eslint-permission-rules.mjs
symbol: main
inputs:
  io: optional IO injection (fixtures / eslintBin / cwd / runEslint / write / writeErr)
returns:
  - "{ exitCode: 0 }"
  - "{ exitCode: 1 }"
throws: []
calls:
  - audit
  - formatReport
called_by:
  - cliMain
  - scripts/verify-all.mjs
emits_events: []
side_effects_on_success:
  - "stdout: 'verify-eslint-permission-rules: OK (<N> fixture(s) checked)'"
side_effects_on_failure: "stderr emits one summary line + one error line per failed fixture; process exits 1"
transaction: none
test: scripts/verify-eslint-permission-rules/__tests__/verify-eslint-permission-rules.test.mjs
spec: scripts/verify-eslint-permission-rules/__specs__/spec.yaml
ai_agent_action:
  when_to_call: "Whenever the user asks 'are the PRIMARY-RULE ESLint guards still wired?' or as part of pnpm verify."
  when_not_to_call: "Mid-refactor of eslint.config.mjs — let the gate speak."
  natural_language_examples:
    - "verify eslint permission rules"
  agent_invocation: "internal — invoked by scripts/verify-all.mjs"
  confirm_with_user_before: "none — read-only"
  summarize_to_user_after: "Quote stdout/stderr verbatim."
paths:
  happy:
    - audit runs every fixture against the local ESLint binary
    - zero failures → OK stdout, exitCode 0
  error_fixture_failures:
    - audit collects one or more fixture failures
    - formatReport emits summary + per-fixture error on stderr; exitCode 1
