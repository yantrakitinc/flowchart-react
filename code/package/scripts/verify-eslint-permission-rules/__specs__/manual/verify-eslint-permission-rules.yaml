flow: verify-eslint-permission-rules
start: "shell at <repo>/code/web"
preconditions:
  - "pnpm install has run (the local node_modules/.bin/eslint exists)"
  - "eslint.config.mjs is the version under test"
steps:
  - action: "Invoke the script directly"
    selector: ""
    input: "node scripts/verify-eslint-permission-rules/verify-eslint-permission-rules.mjs"
    expected: "either an OK line on stdout (exit 0) or a fixture-failure block on stderr (exit 1)"
    assertion: "stdout contains 'verify-eslint-permission-rules: OK' OR stderr contains 'verify-eslint-permission-rules:' with exit code 1"
  - action: "Temporarily relax the brand-cast rule in eslint.config.mjs"
    selector: ""
    input: "comment out the no-restricted-syntax block targeting AuthorizedPrincipal in eslint.config.mjs"
    expected: "the rule is no longer active"
    assertion: "ESLint no longer reports brand-cast violations in synthetic snippets"
  - action: "Re-run the script"
    selector: ""
    input: "node scripts/verify-eslint-permission-rules/verify-eslint-permission-rules.mjs"
    expected: "exit 1 with one or more 'Rule1.violation' fixture failures"
    assertion: "exit code is 1 AND stderr contains 'Rule1.violation'"
  - action: "Restore eslint.config.mjs"
    selector: ""
    input: "git checkout -- eslint.config.mjs"
    expected: "config returns to its committed state"
    assertion: "git status shows no leftover changes"
  - action: "Re-run the script to confirm green"
    selector: ""
    input: "node scripts/verify-eslint-permission-rules/verify-eslint-permission-rules.mjs"
    expected: "exit 0 with OK line"
    assertion: "stdout contains 'verify-eslint-permission-rules: OK'"
assertions:
  - "Exit code 0 when every PRIMARY-RULE guard fires / passes as documented"
  - "Exit code 1 when any guard is silently dropped or relaxed"
  - "stderr names the fixture that failed (Rule<N>.violation/... or Rule<N>.allowed/...)"
failure_capture:
  - "stderr → /tmp/verify-eslint-permission-rules.stderr.txt for triage"
