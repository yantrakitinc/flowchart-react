feature_name: scripts-verify-mode-pristine
version: 1
operation:
  name: Verifier Mode Pristine — code-health proof gate
  slug: "(internal)"
  description: Runs the five code-health stages in sequence — typecheck, build, lint, unit tests, e2e tests (e2e optional, skipped if not configured). First non-zero stage stops the chain. No spec/lock involvement; Mode Pristine answers "is the code currently shippable?" independent of standards-compliance lock state.
invocation:
  type: internal
  method: ""
  path: ""
chat_agent:
  when_to_call: pre-merge gate, after stamps are settled (composed with Compliance for the full pre-merge check)
  when_not_to_call: stamp validation (B / B.5 / D / F) or stamp update (A / C / E)
  natural_language_examples:
    - "mode pristine"
    - "is the code shippable?"
  confirm_before: "none — but expect minutes-long runtime (full build + e2e)"
  summarize_after_success: "Mode Pristine: PASS — all stages green"
  summarize_after_failure: "Mode Pristine: FAIL — stopped at stage <name>"
cross_cutting:
  wcag: "n/a — CLI"
  auth: "filesystem + spawn pnpm"
  mobile: "n/a — CLI"
  i18n: "operator-log English-only"
links:
  flows:
    - flows/main.flow.yaml
